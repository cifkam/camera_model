<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI, NumberController } from 'three/addons/libs/lil-gui.module.min.js';

// lil-gui number controller whose slider track follows a non-linear mapping; the number field stays
// in real units. lil-gui maps the pointer to a linear value in [min, max] and passes it to
// _snapClampSetValue (after _setDraggingStyle(true)); that linear value is reinterpreted through the
// mapping, given as { fromFrac(t, min, max) -> value, toFrac(value, min, max) -> t } with t in [0, 1].
class MappedNumberController extends NumberController {
  constructor(parent, object, property, min, max, step, map) {
    super(parent, object, property, min, max, step);
    this._map = map;
    this.updateDisplay();
  }
  _setDraggingStyle(active, type) {
    this._sliderDrag = active && type !== 'vertical';
    return super._setDraggingStyle(active, type);
  }
  _snapClampSetValue(v) {
    if (this._sliderDrag && this._map) v = this._map.fromFrac((v - this._min) / (this._max - this._min), this._min, this._max);
    return super._snapClampSetValue(v);
  }
  updateDisplay() {
    super.updateDisplay();
    if (this._hasSlider && this._map)
      this.$fill.style.width = 100 * Math.max(0, Math.min(1, this._map.toFrac(this.getValue(), this._min, this._max))) + '%';
    return this;
  }
}
// logarithmic track (min > 0): equal track lengths are equal ratios
const LOG_MAP = {
  fromFrac: (t, lo, hi) => lo > 0 ? Math.exp(Math.log(lo) + t * (Math.log(hi) - Math.log(lo))) : lo + t * (hi - lo),
  toFrac: (v, lo, hi) => lo > 0 ? (Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)) : (v - lo) / (hi - lo),
};
// symmetric power track for ranges [-L, L]: fine near zero, coarse towards the limits (value = ±L·|u|^p)
const symPowMap = p => ({
  fromFrac: (t, lo, hi) => { const u = 2 * t - 1; return Math.sign(u) * hi * Math.abs(u) ** p; },
  toFrac: (v, lo, hi) => (Math.sign(v) * (Math.abs(v) / hi) ** (1 / p) + 1) / 2,
});
const ANGLE_MAP = symPowMap(2);

// ----------------------------------------------------------------------------
// Parameters (camera dimensions in mm, scene in metres)
// ----------------------------------------------------------------------------
const MM = 0.001;
// Slider ranges that scale with the format: lens-related ones with the diagonal, rise/shift with the frame width (mm)
function formatRanges(format = P.format) {
  const [w, h] = FORMATS[format], diag = Math.hypot(w, h);
  return {
    focal: [Math.round(0.3 * diag), Math.round(2.5 * diag)],
    imageCircle: [Math.round(0.8 * diag), Math.round(3 * diag)],
    extension: [Math.round(0.25 * diag), Math.round(3 * diag)],   // the rail is as long as the maximum
    shift: Math.round(0.6 * w),
  };
}
const DEFAULT_FOCUS = 3000;   // mm from the lens: initial focus, and the focus set when the format changes
// standard separation (mm) that focuses a thin lens of focal length f (mm) at distance d (mm)
const separationFor = (f, d) => f * d / (d - f);   // kept exact: short lenses are very sensitive to it
// image area w × h in mm, largest first (roll-film sizes are nominal cm, sheet-film sizes are inches)
const FORMATS = {
  '8x10"': [245, 195], '5x7"': [170, 120], '4x5"': [120, 95],
  '6x9 roll': [84, 56], '6x7 roll': [69.5, 56], '6x6 roll': [56, 56], '6x4.5 roll': [56, 41.5], '35 mm': [36, 24],
  'APS-C': [23.5, 15.6], 'phone 1/1.56"': [8.2, 6.2],
};
// typical image circle (mm at infinity) of a lens made for the format: diagonal plus room for movements
const IMAGE_CIRCLE = { '8x10"': 420, '5x7"': 300, '4x5"': 220,
                       '6x9 roll': 125, '6x7 roll': 100, '6x6 roll': 90, '6x4.5 roll': 80, '35 mm': 45,
                       'APS-C': 30, 'phone 1/1.56"': 11 };
// camera mesh proportions that follow the format: frame bar width and lens barrel radius (m)
const frameBar = ih => THREE.MathUtils.clamp(0.32 * ih, 0.006, 0.03);
const lensRadius = (iw, ih) => THREE.MathUtils.clamp(0.2 * Math.hypot(iw, ih), 0.004, 0.03);

const P = {
  focal: 150,          // lens focal length, mm
  extension: separationFor(150, DEFAULT_FOCUS),   // rail distance between standard centres, mm ("focusing")
  focusDist: DEFAULT_FOCUS * MM,                  // on-axis focus distance from the lens, m (linked to extension)
  camera: 'normal camera',   // 'normal camera' (no movements) or 'view camera' (standards with movements)
  format: '4x5"',
  autoLens: true,      // on format change: focal length = format diagonal, image circle = typical for the format
  refocusOnFocal: true,   // on focal length change: keep the focus distance (separation follows the lens)
  frontTilt: 0, frontSwing: 0, frontRise: 0, frontShift: 0,   // deg, deg, mm, mm
  rearTilt: 0,  rearSwing: 0,  rearRise: 0,  rearShift: 0,
  tiltPivot: 'axis',   // 'axis' (about standard centre) or 'base' (about bottom edge)
  cameraHeight: 1.2,   // optical axis height above ground, m
  extent: 25,          // scene extent, m (to each side and in front of the lens)
  fnumber: 11,
  cocMode: 'from print',   // circle of confusion from print size + viewing, or 'manual'
  printLong: 40,           // print long edge, cm
  viewDist: 50,            // viewing distance, cm
  eyeRes: 1500,            // tolerable blur subtends 1/eyeRes rad at the eye (~2.3 arcmin)
  coc: 0.1,                // manual circle of confusion on film, mm
  showDof: true, showDofPlanes: false,
  imageCircle: 220,        // lens image circle at infinity, mm (coverage / vignetting check)
  showCoverage: true,
  showCoverageCone: false,   // the lens's coverage cone in object space and its section with the plane of sharp focus
  showFov: true, showSharpArea: true, showFullPlane: false,
  showPlanes: true, showLines: false, showBellows: true, showGround: true,
  showUnderground: true,   // draw the faint parts below the ground (only matters while the ground is shown)
};

const COL = {
  posf: 0x4fe07a, posfVirtual: 0xff8a3d, film: 0xffffff, lens: 0x4fa8ff,
  scheimpflug: 0xff4fd8, hinge: 0xffd84f, axis: 0x9ad8ff, fov: 0xc9a0ff, dof: 0x3ee6ff, vignette: 0xff5252,
};

// Circle of confusion on film (mm): tolerable blur on the print, divided by the enlargement.
function circleOfConfusion(filmLongEdgeMM) {
  if (P.cocMode === 'manual') return { coc: P.coc, enlargement: NaN, printBlur: NaN };
  const printBlur = P.viewDist * 10 / P.eyeRes;              // mm on the print
  const enlargement = P.printLong * 10 / filmLongEdgeMM;
  return { coc: printBlur / enlargement, enlargement, printBlur };
}

// ----------------------------------------------------------------------------
// Optics: plane of sharp focus from film plane + thin lens
// ----------------------------------------------------------------------------
// Plane representation: { n: Vector3, d: number } with n·p + d = 0
const planeFrom = (p, n) => ({ n: n.clone(), d: -n.dot(p) });
const sdf = (pl, p) => pl.n.dot(p) + pl.d;
function normalizePlane(pl) {
  const L = pl.n.length();
  if (L < 1e-12) return null;              // plane at infinity
  return { n: pl.n.clone().divideScalar(L), d: pl.d / L };
}

// Lens coordinate frame: origin at the lens centre, z along the lens axis towards the subject
function lensBasis(C, q) {
  return {
    C,
    u: new THREE.Vector3(1, 0, 0).applyQuaternion(q),
    v: new THREE.Vector3(0, 1, 0).applyQuaternion(q),
    n: new THREE.Vector3(0, 0, 1).applyQuaternion(q),
  };
}
function toLensPlane(B, pl) {
  return normalizePlane({ n: new THREE.Vector3(pl.n.dot(B.u), pl.n.dot(B.v), pl.n.dot(B.n)), d: pl.d + pl.n.dot(B.C) });
}

/**
 * A thin lens maps object space to image space projectively. In lens
 * coordinates a point (x,y,z) on the film side maps to (f x, f y, f z) / (z + f).
 * Planes transform with the inverse-transpose: (a,b,c,d) -> (a f, b f, c f - d, d f).
 * The image of the film plane under this map is the plane of sharp focus; the
 * images of the film plane scaled by 1/(1 ± k) about the lens centre are the
 * depth-of-field limit planes (see focusInterval). Returns a world plane.
 */
function imageOfLensPlane(B, pl, f) {
  const { x: a, y: b, z: c } = pl.n, d = pl.d;
  const a2 = a * f, b2 = b * f, c2 = c * f - d, d2 = d * f;
  const nw = B.u.clone().multiplyScalar(a2).add(B.v.clone().multiplyScalar(b2)).add(B.n.clone().multiplyScalar(c2));
  return normalizePlane({ n: nw, d: d2 - nw.dot(B.C) });
}

/**
 * In-focus interval along a chief ray from the lens centre (unit direction
 * dirWorld). For an object at distance t the converging cone behind the lens is
 * cut by the film plane at parameter s0 = alpha + beta/t (s0 = 1 exactly at the
 * image point), so the blur diameter is (f/N)·|1 - s0|. It stays below the
 * circle of confusion c when |1 - s0| <= k = c·N/f, an interval in 1/t.
 * Returns { tNear, tFar } in metres (tFar may be Infinity) or null.
 */
function focusInterval(B, filmL, f, k, dirWorld) {
  const r = new THREE.Vector3(dirWorld.dot(B.u), dirWorld.dot(B.v), dirWorld.dot(B.n));
  const nr = filmL.n.dot(r);
  if (Math.abs(nr) < 1e-9 || r.z <= 0) return null;
  const alpha = filmL.d * r.z / (f * nr), beta = -filmL.d / nr;
  let w0 = (1 - k - alpha) / beta, w1 = (1 + k - alpha) / beta;
  if (w0 > w1) [w0, w1] = [w1, w0];
  w0 = Math.max(w0, 0);
  if (w1 <= 0 || w0 > w1) return null;
  return { tNear: 1 / w1, tFar: w0 > 0 ? 1 / w0 : Infinity };
}

function intersectPlanes(p1, p2) {
  const dir = p1.n.clone().cross(p2.n);
  const L2 = dir.lengthSq();
  if (L2 < 1e-10) return null;             // parallel planes
  const h1 = -p1.d, h2 = -p2.d;
  const pt = p2.n.clone().cross(dir).multiplyScalar(h1)
    .add(dir.clone().cross(p1.n).multiplyScalar(h2)).multiplyScalar(1 / L2);
  return { p: pt, dir: dir.normalize() };
}

function clipLineToBox(line, min, max) {
  let t0 = -Infinity, t1 = Infinity;
  for (const k of ['x', 'y', 'z']) {
    const p = line.p[k], d = line.dir[k];
    if (Math.abs(d) < 1e-12) { if (p < min[k] || p > max[k]) return null; continue; }
    let a = (min[k] - p) / d, b = (max[k] - p) / d;
    if (a > b) [a, b] = [b, a];
    t0 = Math.max(t0, a); t1 = Math.min(t1, b);
  }
  if (t0 > t1) return null;
  return [line.p.clone().addScaledVector(line.dir, t0), line.p.clone().addScaledVector(line.dir, t1)];
}

// Order coplanar points (with plane normal n) counter-clockwise around their centroid
function sortAroundCentroid(pts, n) {
  const ctr = pts.reduce((acc, p) => acc.add(p), new THREE.Vector3()).divideScalar(pts.length);
  const nn = n.clone().normalize();
  const e1 = (Math.abs(nn.x) < 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0)).cross(nn).normalize();
  const e2 = nn.clone().cross(e1);
  const ang = p => { const r = p.clone().sub(ctr); return Math.atan2(r.dot(e2), r.dot(e1)); };
  return pts.sort((a, b) => ang(a) - ang(b));
}

function boxCorners(min, max) {
  const c = [];
  for (let i = 0; i < 8; i++)
    c.push(new THREE.Vector3(i & 1 ? max.x : min.x, i & 2 ? max.y : min.y, i & 4 ? max.z : min.z));
  return c;
}

function clipPlaneToBox(pl, min, max) {
  const c = boxCorners(min, max);
  const E = [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
  const pts = [];
  for (const [i, j] of E) {
    const s0 = sdf(pl, c[i]), s1 = sdf(pl, c[j]);
    if ((s0 < 0) !== (s1 < 0)) pts.push(c[i].clone().lerp(c[j], s0 / (s0 - s1)));
  }
  return pts.length < 3 ? [] : sortAroundCentroid(pts, pl.n);
}

// distance along a ray (origin p, unit direction dir, inside the box) to the point where it leaves the box
function rayExitT(p, dir, min, max) {
  let t = Infinity;
  for (const k of ['x', 'y', 'z']) {
    if (Math.abs(dir[k]) < 1e-12) continue;
    const tk = ((dir[k] > 0 ? max[k] : min[k]) - p[k]) / dir[k];
    if (tk > 0) t = Math.min(t, tk);
  }
  return Number.isFinite(t) ? t : 0;
}

// Sutherland–Hodgman clip of a convex polygon, keeping the side where sdf(pl) >= 0
function clipPolygonToHalfSpace(pts, pl) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length], sa = sdf(pl, a), sb = sdf(pl, b);
    if (sa >= 0) out.push(a);
    if ((sa >= 0) !== (sb >= 0)) out.push(a.clone().lerp(b, sa / (sa - sb)));
  }
  return out;
}

// Convex polyhedron = list of convex faces (arrays of Vector3, outward order not required)
function boxPolyhedron(min, max) {
  const c = boxCorners(min, max);
  return [[0,1,3,2],[4,6,7,5],[0,4,5,1],[2,3,7,6],[0,2,6,4],[1,5,7,3]].map(ix => ix.map(i => c[i].clone()));
}

// Clip a convex polyhedron by a half-space (keep sdf >= 0); the cut is closed with a new cap face
function clipPolyhedron(faces, pl) {
  const out = [], cap = [];
  const eps = 1e-7;
  for (const face of faces) {
    const clipped = clipPolygonToHalfSpace(face, pl);
    if (clipped.length >= 3) out.push(clipped);
    for (const p of clipped)
      if (Math.abs(sdf(pl, p)) < eps && !cap.some(q => q.distanceToSquared(p) < eps * eps)) cap.push(p);
  }
  if (cap.length >= 3) out.push(sortAroundCentroid(cap, pl.n));
  return out;
}

// Pose of a standard: nominal centre on the rail + movements
function standardPose(nominal, tiltDeg, swingDeg, rise, shift, halfH) {
  const qTilt = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), THREE.MathUtils.degToRad(tiltDeg));
  const qSwing = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(swingDeg));
  const q = qSwing.clone().multiply(qTilt);          // tilt in the standard's frame, then swing about vertical
  let c = nominal.clone().add(new THREE.Vector3(shift, rise, 0));
  if (P.tiltPivot === 'base') {
    const pivot = c.clone().add(new THREE.Vector3(0, -halfH, 0));
    c = pivot.add(new THREE.Vector3(0, halfH, 0).applyQuaternion(q));
  }
  return { position: c, quaternion: q };
}

// ----------------------------------------------------------------------------
// Scene setup
// ----------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c1e22);
scene.fog = new THREE.Fog(0x1c1e22, 30, 140);   // beyond the largest scene extent, so nothing clipped fades out entirely

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 200);
camera.position.set(-2.8, 2.2, -2.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.2, 1.0, 1.4);
controls.enableDamping = true;
controls.minDistance = 0.05;
controls.maxDistance = 300;
// Wheel zoom: OrbitControls scales by the raw wheel delta, which browsers report inconsistently
// (e.g. Firefox at a page zoom other than 100 %), so take over wheel zoom with the same notch
// calibration as the sliders: ~10 % per notch, capped per event. Touch pinch stays with OrbitControls.
document.body.addEventListener('wheel', e => {
  if (e.target !== renderer.domElement) return;
  e.preventDefault(); e.stopImmediatePropagation();
  let notches = e.deltaY / (e.deltaMode === 0 ? 100 : e.deltaMode === 1 ? 3 : 1);
  if (e.ctrlKey) notches *= 3;                                   // touchpad pinch arrives as ctrl+wheel with small deltas
  notches = THREE.MathUtils.clamp(notches, -3, 3);
  const offset = camera.position.clone().sub(controls.target);
  const dist = THREE.MathUtils.clamp(offset.length() * Math.pow(1.1, notches), controls.minDistance, controls.maxDistance);
  camera.position.copy(controls.target).addScaledVector(offset.normalize(), dist);
}, { capture: true, passive: false });

scene.add(new THREE.HemisphereLight(0xffffff, 0x303040, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(3, 6, -2);
scene.add(sun);

const dyn = new THREE.Group();   // everything rebuilt on every parameter change
scene.add(dyn);

const mats = {};
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!mats[key]) {
    const { opacity = 1, basic = false, side = THREE.DoubleSide, depthTest = true } = opts;
    const M = basic ? THREE.MeshBasicMaterial : THREE.MeshStandardMaterial;
    mats[key] = new M({ color, transparent: opacity < 1, opacity, side, depthWrite: opacity >= 1, depthTest,
      ...(basic ? {} : { roughness: 0.6, metalness: 0.1 }) });
  }
  return mats[key];
}

function clearGroup(g) {
  while (g.children.length) {
    const o = g.children.pop();
    o.traverse(x => { if (x.geometry) x.geometry.dispose(); });
  }
}

const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
function tube(p0, p1, r, m) {
  const dir = p1.clone().sub(p0), len = dir.length();
  if (len < 1e-9) return new THREE.Group();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10, 1), m);
  mesh.position.copy(p0).add(p1).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return mesh;
}
function polygon(pts, m) {
  if (pts.length < 3) return new THREE.Group();
  const pos = [];
  for (let i = 1; i < pts.length - 1; i++) pos.push(...pts[0].toArray(), ...pts[i].toArray(), ...pts[i + 1].toArray());
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return new THREE.Mesh(g, m);
}
function outline(pts, color, { opacity = 0.9, depthTest = true } = {}) {
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.LineLoop(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthTest }));
}
// Below-ground parts are drawn faintly and without depth test, so they stay visible through the opaque ground
const UNDER_FILL = 0.2, UNDER_LINE = 0.2;   // opacity factor for fills, absolute opacity for outlines, below ground
const UNDER_FILLS_VISIBLE = false;           // false: below ground only the outlines and rays are drawn, no fills
const GROUND_UP = { n: new THREE.Vector3(0, 1, 0), d: 0 }, GROUND_DOWN = { n: new THREE.Vector3(0, -1, 0), d: 0 };
// (the split is only made while the ground is drawn; its cut edge is not outlined, so no seam shows)
function drawPlanePoly(group, poly, color, opacity) {
  if (poly.length < 3) return;
  if (!P.showGround) { group.add(polygon(poly, mat(color, { opacity, basic: true }))); group.add(outline(poly, color)); return; }
  const notCut = (a, b) => !(Math.abs(a.y) < 1e-6 && Math.abs(b.y) < 1e-6);
  const edges = (pts, opts) => {
    const segs = [];
    for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; if (notCut(a, b)) segs.push(a, b); }
    return segs.length ? new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(segs),
      new THREE.LineBasicMaterial({ color, transparent: true, ...opts })) : new THREE.Group();
  };
  const above = clipPolygonToHalfSpace(poly, GROUND_UP), below = clipPolygonToHalfSpace(poly, GROUND_DOWN);
  if (above.length >= 3) { group.add(polygon(above, mat(color, { opacity, basic: true }))); group.add(edges(above, { opacity: 0.9 })); }
  if (below.length >= 3 && P.showUnderground) {
    if (UNDER_FILLS_VISIBLE) group.add(polygon(below, mat(color, { opacity: opacity * UNDER_FILL, basic: true, depthTest: false })));
    group.add(edges(below, { opacity: UNDER_LINE, depthTest: false }));
  }
}
// Framed geometry (sharp area, in-focus volume): while the ground is drawn, the part below it
// is drawn at reduced opacity and without depth test so it shows through the floor
function drawFramedPolys(group, polys, color, opacity, outlineColor, box) {
  const parts = P.showGround
    ? [[polys.map(p => clipPolygonToHalfSpace(p, GROUND_UP)), false], [polys.map(p => clipPolygonToHalfSpace(p, GROUND_DOWN)), true]]
    : [[polys, false]];
  for (const [list, under] of parts) {
    if (under && !P.showUnderground) continue;
    const faces = list.filter(p => p.length >= 3);
    if (!faces.length) continue;
    if (!under || UNDER_FILLS_VISIBLE)
      group.add(polyhedronMesh(faces, mat(color, { opacity: under ? opacity * UNDER_FILL : opacity, basic: true, depthTest: !under })));
    if (outlineColor === null) continue;
    for (const fc of faces)
      group.add(outlineEdges(fc, outlineColor, box, { opacity: under ? UNDER_LINE : 0.9, depthTest: !under, cutY0: P.showGround }));
  }
}
function drawLineSeg(group, seg, color, r, opacity = 1) {
  const [a, b] = seg, parts = [];
  if (P.showGround && (a.y < 0) !== (b.y < 0)) { const m = a.clone().lerp(b, a.y / (a.y - b.y)); parts.push([a, m], [m, b]); }
  else parts.push([a, b]);
  for (const [p, q] of parts) {
    const under = P.showGround && p.y + q.y < 0;
    if (under && !P.showUnderground) continue;
    group.add(tube(p, q, r, mat(color, under ? { basic: true, opacity: opacity * UNDER_FILL, depthTest: false } : { basic: true, opacity })));
  }
}
function polyhedronMesh(faces, m) {
  const pos = [];
  for (const fc of faces)
    for (let i = 1; i < fc.length - 1; i++) pos.push(...fc[0].toArray(), ...fc[i].toArray(), ...fc[i + 1].toArray());
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return new THREE.Mesh(g, m);
}
// polygon outline that skips edges lying on a face of the clipping box (those are cuts, not real boundaries)
function outlineEdges(pts, color, box, { opacity = 0.9, depthTest = true, cutY0 = false } = {}) {
  const onFace = (p, q) => ['x', 'y', 'z'].some(k =>
    [box.min[k], box.max[k]].some(v => Math.abs(p[k] - v) < 1e-6 && Math.abs(q[k] - v) < 1e-6))
    || (cutY0 && Math.abs(p.y) < 1e-6 && Math.abs(q.y) < 1e-6);
  const segs = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    if (!onFace(a, b)) segs.push(a, b);
  }
  if (!segs.length) return new THREE.Group();
  return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(segs),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthTest }));
}

function buildStandard(pose, iw, ih, bar, depth, kind) {
  const g = new THREE.Group();
  g.position.copy(pose.position);
  g.quaternion.copy(pose.quaternion);
  const fw = iw + 2 * bar + 0.02, fh = ih + 2 * bar + 0.02;
  const frameM = mat(kind === 'rear' ? 0x5a4634 : 0x4a3a2c);
  for (const [w, h, x, y] of [[fw, bar, 0, fh / 2 - bar / 2], [fw, bar, 0, -fh / 2 + bar / 2],
                              [bar, fh, fw / 2 - bar / 2, 0], [bar, fh, -fw / 2 + bar / 2, 0]]) {
    const b = box(w, h, depth, frameM); b.position.set(x, y, 0); g.add(b);
  }
  if (kind === 'rear') {
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(iw, ih), mat(0xcfe3ff, { opacity: 0.35 }));
    g.add(glass);
    const corners = [[-iw/2,-ih/2],[iw/2,-ih/2],[iw/2,ih/2],[-iw/2,ih/2]].map(([x, y]) => new THREE.Vector3(x, y, 0));
    g.add(outline(corners, 0xffffff));
  } else {
    const board = new THREE.Mesh(new THREE.PlaneGeometry(fw - 2 * bar, fh - 2 * bar), mat(0x202020, { opacity: 0.95 }));
    g.add(board);
    const lr = lensRadius(iw, ih);
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(lr, lr, 1.85 * lr, 32), mat(0x9aa0a8, { opacity: 1 }));
    barrel.rotation.x = Math.PI / 2; g.add(barrel);
    for (const z of [0.95 * lr, -0.95 * lr]) {
      const el = new THREE.Mesh(new THREE.CircleGeometry(0.87 * lr, 32), mat(0x5aa9ff, { opacity: 0.55 }));
      el.position.z = z; g.add(el);
    }
  }
  return g;
}

// ----------------------------------------------------------------------------
// Rebuild everything from P
// ----------------------------------------------------------------------------
const infoEl = document.getElementById('info');
const cocCtrls = { print: [], manual: [] };   // filled in by the GUI section
let focusCtrl = null;                          // the focus-distance slider, set by the GUI section
const FOCUS_SLIDER_CAP = 30;                   // m; the far end of the slider runs to infinity, so cap it
const BEHIND = 2;                              // m of scene kept behind the lens (ground, planes, lines)

// frame outer height for the current format (tilt pivot for base tilts), m
const frameHeight = () => { const ih = FORMATS[P.format][1] * MM; return ih + 2 * frameBar(ih) + 0.02; };

// On-axis film distance (lens centre to film plane along the lens axis, m) for a
// given separation (m) with the current movements. Affine in the separation.
function onAxisFilmDistance(ext) {
  const hh = frameHeight() / 2, h = P.cameraHeight;
  const rear = standardPose(new THREE.Vector3(0, h, -ext), P.rearTilt, P.rearSwing, P.rearRise * MM, P.rearShift * MM, hh);
  const front = standardPose(new THREE.Vector3(0, h, 0), P.frontTilt, P.frontSwing, P.frontRise * MM, P.frontShift * MM, hh);
  const nl = new THREE.Vector3(0, 0, 1).applyQuaternion(front.quaternion);
  const nr = new THREE.Vector3(0, 0, 1).applyQuaternion(rear.quaternion);
  return nr.dot(front.position.clone().sub(rear.position)) / nr.dot(nl);
}

// Set the separation so that the lens focuses at distance d (m) on its axis
function setSeparationForFocus(d) {
  const f = P.focal * MM;
  if (!(d > f)) return;
  const sReq = f * d / (d - f);
  const s0 = onAxisFilmDistance(0), slope = onAxisFilmDistance(1) - s0;
  if (Math.abs(slope) < 1e-9) return;
  const [lo, hi] = formatRanges().extension;
  P.extension = THREE.MathUtils.clamp((sReq - s0) / slope / MM, lo, hi);
}
const fmt = (x, n = 2) => Number.isFinite(x) ? x.toFixed(n) : '–';
const sw = c => `<span class="sw" style="background:#${c.toString(16).padStart(6, '0')}"></span>`;

function update() {
  clearGroup(dyn);
  const E = P.extent, h = P.cameraHeight, f = P.focal * MM, ext = P.extension * MM;
  const [iw, ih] = FORMATS[P.format].map(v => v * MM);
  const bar = frameBar(ih), depth = 0.014;
  const fw = iw + 2 * bar + 0.02, fh = ih + 2 * bar + 0.02;
  const railY = h - fh / 2 - 0.06;

  // --- standards --------------------------------------------------------------
  // the lens stays fixed in space (z = 0); focusing slides the rear standard along the rail
  const rearNom = new THREE.Vector3(0, h, -ext), frontNom = new THREE.Vector3(0, h, 0);
  const rear = standardPose(rearNom, P.rearTilt, P.rearSwing, P.rearRise * MM, P.rearShift * MM, fh / 2);
  const front = standardPose(frontNom, P.frontTilt, P.frontSwing, P.frontRise * MM, P.frontShift * MM, fh / 2);
  dyn.add(buildStandard(rear, iw, ih, bar, depth, 'rear'));
  dyn.add(buildStandard(front, iw, ih, bar, depth, 'front'));

  // --- rail, posts, tripod ----------------------------------------------------
  const railM = mat(0x2b2d33), postM = mat(0x44474f);
  // fixed monorail: ends at the front standard, long enough for the rear one at maximum separation
  const railLen = formatRanges().extension[1] * MM + 0.08, RAIL_Z = 0.04 - railLen / 2;   // tripod under the rail's middle
  const rail = box(0.04, 0.03, railLen, railM); rail.position.set(0, railY, RAIL_Z); dyn.add(rail);
  for (const [nom, pose] of [[rearNom, rear], [frontNom, front]]) {
    const top = new THREE.Vector3(pose.position.x, pose.position.y - fh / 2, nom.z);
    const bottom = new THREE.Vector3(pose.position.x, railY + 0.015, nom.z);
    dyn.add(tube(bottom, top, 0.012, postM));
    // crossbar: spans from the rail to the (shifted) post, so it always rests on the rail
    const sx = pose.position.x;
    const foot = box(Math.abs(sx) + 0.07, 0.02, 0.05, postM); foot.position.set(sx / 2, railY + 0.025, nom.z); dyn.add(foot);
  }
  const colTop = new THREE.Vector3(0, railY - 0.02, RAIL_Z);
  dyn.add(tube(new THREE.Vector3(0, railY - 0.25, RAIL_Z), colTop, 0.015, postM));
  for (let k = 0; k < 3; k++) {
    const a = k * 2 * Math.PI / 3 + Math.PI / 6;
    dyn.add(tube(colTop.clone().add(new THREE.Vector3(0, -0.2, 0)),
      new THREE.Vector3(0.55 * Math.cos(a), 0, RAIL_Z + 0.55 * Math.sin(a)), 0.009, postM));
  }

  // --- bellows ----------------------------------------------------------------
  if (P.showBellows) {
    const inW = fw - 2 * bar, inH = fh - 2 * bar;
    const corner = (pose, sx, sy) => new THREE.Vector3(sx * inW / 2, sy * inH / 2, 0).applyQuaternion(pose.quaternion).add(pose.position);
    const S = [[-1,-1],[1,-1],[1,1],[-1,1]];
    const r = S.map(([x, y]) => corner(rear, x, y)), fr = S.map(([x, y]) => corner(front, x, y));
    const pos = [];
    for (let i = 0; i < 4; i++) {
      const j = (i + 1) % 4;
      pos.push(...r[i].toArray(), ...fr[i].toArray(), ...fr[j].toArray(), ...r[i].toArray(), ...fr[j].toArray(), ...r[j].toArray());
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.computeVertexNormals();
    dyn.add(new THREE.Mesh(g, mat(0x7a1f1f, { opacity: 0.55 })));
  }

  // --- ground -----------------------------------------------------------------
  if (P.showGround) {
    // rectangular grid matching the clipping box footprint: x in [-E, E], z in [-1, 2E], 0.5 m cells
    const gx0 = -E, gx1 = E, gz0 = -BEHIND, gz1 = E, step = 0.5;
    const minor = [], major = [];
    for (let x = Math.ceil(gx0 / step) * step; x <= gx1 + 1e-9; x += step)
      (Math.abs(x) < 1e-9 ? major : minor).push(new THREE.Vector3(x, 0, gz0), new THREE.Vector3(x, 0, gz1));
    for (let z = Math.ceil(gz0 / step) * step; z <= gz1 + 1e-9; z += step)
      (Math.abs(z) < 1e-9 ? major : minor).push(new THREE.Vector3(gx0, 0, z), new THREE.Vector3(gx1, 0, z));
    for (const [pts, color] of [[minor, 0x343842], [major, 0x555a66]])
      dyn.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color })));
    // opaque and depth-writing, so anything below ground is hidden; offset back to avoid z-fighting with the grid
    mats.ground ??= new THREE.MeshStandardMaterial({ color: 0x23262c, roughness: 0.9,
      polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(gx1 - gx0, gz1 - gz0), mats.ground);
    ground.rotation.x = -Math.PI / 2; ground.position.set(0, -0.001, (gz0 + gz1) / 2); dyn.add(ground);
  }

  // --- optics -----------------------------------------------------------------
  const nl = new THREE.Vector3(0, 0, 1).applyQuaternion(front.quaternion);
  const nr = new THREE.Vector3(0, 0, 1).applyQuaternion(rear.quaternion);
  const Cl = front.position, Cr = rear.position;
  const filmPlane = planeFrom(Cr, nr), lensPlane = planeFrom(Cl, nl);
  const focalPlane = planeFrom(Cl.clone().addScaledVector(nl, f), nl);
  const B = lensBasis(Cl, front.quaternion);
  const filmL = toLensPlane(B, filmPlane);
  const posf = imageOfLensPlane(B, filmL, f);

  // depth of field: blur <= circle of confusion  <=>  |1 - s0| <= k   (see focusInterval)
  const { coc, enlargement, printBlur } = circleOfConfusion(FORMATS[P.format][0]);
  const k = coc * MM * P.fnumber / f;
  const nearPlane = k < 1 ? imageOfLensPlane(B, { n: filmL.n, d: filmL.d / (1 - k) }, f) : null;
  const farPlane = imageOfLensPlane(B, { n: filmL.n, d: filmL.d / (1 + k) }, f);
  for (const c of cocCtrls.print) c.enable(P.cocMode === 'from print');
  for (const c of cocCtrls.manual) c.enable(P.cocMode === 'manual');

  // on-axis image distance (lens centre -> film along the lens axis)
  const s = nr.dot(Cl.clone().sub(Cr)) / nr.dot(nl);
  const dObj = s > f ? f * s / (s - f) : (s === f ? Infinity : f * s / (s - f));
  const virtual = s <= f;

  // keep the focus-distance slider in step: its range follows the separation limits
  if (focusCtrl) {
    const [extLo, extHi] = formatRanges().extension;
    const sMin = onAxisFilmDistance(extLo * MM), sMax = onAxisFilmDistance(extHi * MM);
    const conj = sv => sv > f ? f * sv / (sv - f) : Infinity;
    const dMin = Math.max(0.01, Math.min(conj(sMax), FOCUS_SLIDER_CAP - 0.01));
    const dMax = Math.min(conj(sMin), FOCUS_SLIDER_CAP);
    focusCtrl.min(Math.round(dMin * 100) / 100).max(Math.round(dMax * 100) / 100);
    P.focusDist = Math.round(100 * (virtual ? dMax : THREE.MathUtils.clamp(dObj, dMin, dMax))) / 100;
    focusCtrl.updateDisplay();
  }

  // One scene box for everything that gets clipped: E to each side and forward of the lens,
  // BEHIND metres behind it, E below ground and E above the lens.
  const SB = { min: new THREE.Vector3(-E, -E, -BEHIND), max: new THREE.Vector3(E, h + E, E) };
  const bigBox = SB;
  // framed things (sharp area, in-focus volume) stop at the ground while it is drawn, otherwise they use the whole box
  const posfBox = SB;   // framed things are split at the ground when drawn (see drawFramedPolys)
  const camBox = { min: new THREE.Vector3(-0.45, -E, -ext - 0.6), max: new THREE.Vector3(0.45, h + E, 0.6) };

  const posfColor = virtual ? COL.posfVirtual : COL.posf;
  // Extended planes reach below ground. The plane of sharp focus is drawn back to the lens
  // plane, i.e. to the Scheimpflug line (the classic picture); the DoF limit planes end at the
  // front focal plane, where they meet the hinge line, since the wedge has its apex there.
  const fullBox = SB;
  const extended = (pl, cut) => clipPolygonToHalfSpace(clipPlaneToBox(pl, fullBox.min, fullBox.max), cut);
  if (posf && P.showFullPlane) drawPlanePoly(dyn, extended(posf, lensPlane), posfColor, P.showSharpArea ? 0.15 : 0.35);
  if (P.showDofPlanes)
    for (const pl of [nearPlane, farPlane]) if (pl) drawPlanePoly(dyn, extended(pl, focalPlane), COL.dof, 0.07);

  // --- field of view: film gate corners through the lens centre ----------------
  // Chief rays pass through the lens centre undeviated, so the object-space frustum
  // is bounded by the four planes through the lens centre and the gate edges.
  const gate = [[-1,-1],[1,-1],[1,1],[-1,1]].map(([x, y]) =>
    new THREE.Vector3(x * iw / 2, y * ih / 2, 0).applyQuaternion(rear.quaternion).add(Cr));
  const rayDirs = gate.map(g => Cl.clone().sub(g).normalize());
  const insidePt = Cl.clone().multiplyScalar(2).sub(Cr);      // mirror image of the film centre: inside the frustum
  const frustum = [];
  for (let i = 0; i < 4; i++) {
    const pl = planeFrom(Cl, gate[i].clone().sub(Cl).cross(gate[(i + 1) % 4].clone().sub(Cl)));
    if (sdf(pl, insidePt) < 0) { pl.n.negate(); pl.d = -pl.d; }
    frustum.push(pl);
  }
  // lens coverage: a gate corner is vignetted when it lies outside the cone of half-angle atan(IC / 2f)
  const covAngle = Math.atan(P.imageCircle * MM / 2 / f);
  const back = nl.clone().negate();
  const corVig = gate.map(g => Math.acos(Math.min(1, g.clone().sub(Cl).normalize().dot(back))) > covAngle);
  const nVig = corVig.filter(Boolean).length;
  // conjugates of the gate corners on the plane of sharp focus (readout only)
  const hits = posf ? rayDirs.map(d => {
    const den = posf.n.dot(d), t = Math.abs(den) < 1e-12 ? -1 : -sdf(posf, Cl) / den;
    return t > 0 ? Cl.clone().addScaledVector(d, t) : null;
  }) : [];
  const sharpQuad = hits.length && hits.every(Boolean) ? hits : null;

  if (P.showFov) {
    const far = rayDirs.map(d => Cl.clone().addScaledVector(d, rayExitT(Cl, d, SB.min, SB.max)));
    for (let i = 0; i < 4; i++) {
      const c = corVig[i] ? COL.vignette : COL.fov;
      dyn.add(tube(gate[i], Cl, 0.0015, mat(c, { opacity: 0.85, basic: true })));   // inside the camera
      drawLineSeg(dyn, [Cl, far[i]], c, 0.0025, 0.85);                             // split at the ground like the planes
    }
    const sides = [];
    for (let i = 0; i < 4; i++) sides.push([Cl.clone(), far[i].clone(), far[(i + 1) % 4].clone()]);
    drawFramedPolys(dyn, sides, COL.fov, 0.06, null, SB);
  }
  if (P.showCoverage) {
    // outline of the coverage cone on the film plane: an ellipse, or a hyperbola branch for strong tilts
    const M = 96, ring = [];
    for (let i = 0; i <= M; i++) {
      const phi = i / M * 2 * Math.PI;
      const dir = back.clone().multiplyScalar(Math.cos(covAngle))
        .addScaledVector(B.u, Math.sin(covAngle) * Math.cos(phi)).addScaledVector(B.v, Math.sin(covAngle) * Math.sin(phi));
      const den = filmPlane.n.dot(dir), t = Math.abs(den) < 1e-9 ? -1 : -sdf(filmPlane, Cl) / den;
      ring.push(t > 0 && t < 1.5 ? Cl.clone().addScaledVector(dir, t) : null);
    }
    const segs = [];
    for (let i = 0; i < M; i++) if (ring[i] && ring[i + 1]) segs.push(ring[i], ring[i + 1]);
    if (segs.length) dyn.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(segs),
      new THREE.LineBasicMaterial({ color: nVig ? COL.vignette : 0x9a9a9a, transparent: true, opacity: 0.9 })));
  }

  // --- sharp area in frame: plane of sharp focus ∩ frustum ---------------------
  // Only the part beyond the front focal plane is real. The area is unbounded when
  // part of the frame looks past the plane (it leaves through infinity); it is then
  // cut at the scene box.
  let sharpPoly = posf ? clipPlaneToBox(posf, posfBox.min, posfBox.max) : [];
  for (const pl of [...frustum, focalPlane]) sharpPoly = clipPolygonToHalfSpace(sharpPoly, pl);
  if (P.showSharpArea && sharpPoly.length >= 3) drawFramedPolys(dyn, [sharpPoly], posfColor, 0.6, 0xffffff, posfBox);

  // --- lens coverage cone in object space ---------------------------------------
  // Everything inside the cone of half-angle atan(IC / 2f) about the lens axis can be
  // projected onto the film; its section with the plane of sharp focus is the area that
  // could be imaged sharply with the current image circle (an ellipse, or an open curve
  // when the plane cuts through the cone's side).
  if (P.showCoverageCone) {
    const M = 64, covColor = nVig ? COL.vignette : 0x9a9a9a, ends = [], onPlane = [];
    const inBox = p => ['x', 'y', 'z'].every(c => p[c] >= SB.min[c] - 1e-6 && p[c] <= SB.max[c] + 1e-6);
    for (let i = 0; i < M; i++) {
      const phi = i / M * 2 * Math.PI;
      const dir = nl.clone().multiplyScalar(Math.cos(covAngle))
        .addScaledVector(B.u, Math.sin(covAngle) * Math.cos(phi)).addScaledVector(B.v, Math.sin(covAngle) * Math.sin(phi));
      ends.push(Cl.clone().addScaledVector(dir, rayExitT(Cl, dir, SB.min, SB.max)));
      const den = posf ? posf.n.dot(dir) : 0, t = Math.abs(den) < 1e-9 ? -1 : -sdf(posf, Cl) / den;
      const pt = t > 0 ? Cl.clone().addScaledVector(dir, t) : null;
      onPlane.push(pt && inBox(pt) ? pt : null);
    }
    drawFramedPolys(dyn, ends.map((e, i) => [Cl.clone(), e, ends[(i + 1) % M]]), covColor, 0.05, null, SB);
    for (let i = 0; i < M; i += 8) drawLineSeg(dyn, [Cl, ends[i]], covColor, 0.0015, 0.35);
    if (onPlane.every(Boolean)) {
      drawFramedPolys(dyn, [onPlane], covColor, 0.18, covColor, SB);
    } else {
      const segs = [];
      for (let i = 0; i < M; i++) { const a = onPlane[i], b = onPlane[(i + 1) % M]; if (a && b) segs.push(a, b); }
      if (segs.length) dyn.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(segs),
        new THREE.LineBasicMaterial({ color: covColor, transparent: true, opacity: 0.9 })));
    }
  }

  // --- depth of field volume inside the frame ---------------------------------
  // Acceptably sharp <=> |1 - s0| <= k. In image space that is the slab between the
  // film plane scaled by 1/(1-k) and by 1/(1+k) about the lens centre; its object-
  // space image is the region between the near and far limit planes (which may wrap
  // through infinity). Beyond the front focal plane the thin-lens map preserves
  // convexity, so the in-focus volume in the frame is the scene box clipped by the
  // frustum sides, the front focal plane and the near / far half-spaces.
  const sgn = Math.sign(filmL.d);
  const halfSpaces = [...frustum, focalPlane];
  if (nearPlane) halfSpaces.push({ n: nearPlane.n.clone().multiplyScalar(-sgn), d: -sgn * nearPlane.d });
  if (farPlane) halfSpaces.push({ n: farPlane.n.clone().multiplyScalar(sgn), d: sgn * farPlane.d });
  let dofFaces = boxPolyhedron(posfBox.min, posfBox.max);
  for (const pl of halfSpaces) { dofFaces = clipPolyhedron(dofFaces, pl); if (!dofFaces.length) break; }
  if (P.showDof && dofFaces.length) drawFramedPolys(dyn, dofFaces, COL.dof, 0.16, COL.dof, posfBox);
  const ivs = rayDirs.map(d => focusInterval(B, filmL, f, k, d));
  const axisIv = focusInterval(B, filmL, f, k, nl);
  const dofInfo = { farInfinite: ivs.some(iv => iv && !Number.isFinite(iv.tFar)), missing: ivs.filter(iv => !iv).length };
  if (P.showPlanes) {
    for (const [pl, c] of [[filmPlane, COL.film], [lensPlane, COL.lens]])
      drawPlanePoly(dyn, clipPlaneToBox(pl, camBox.min, camBox.max), c, 0.12);
  }

  // lens axis and on-axis focus point
  const tFocus = posf ? -sdf(posf, Cl) / posf.n.dot(nl) : Infinity;
  const tExit = rayExitT(Cl, nl, SB.min, SB.max);
  const axisEnd = Cl.clone().addScaledVector(nl, Number.isFinite(tFocus) && tFocus > 0 ? Math.min(tFocus, tExit) : tExit);
  dyn.add(tube(Cl.clone().addScaledVector(nl, -s), axisEnd, 0.004, mat(COL.axis, { opacity: 0.8, basic: true })));
  if (Number.isFinite(tFocus) && tFocus > 0) {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 12), mat(COL.axis, { basic: true }));
    dot.position.copy(axisEnd); dyn.add(dot);
  }

  // Scheimpflug line (film ∩ lens plane) and hinge line (PoSF ∩ front focal plane)
  let schLine = null, hingeLine = null;
  if (P.showLines) {
    schLine = intersectPlanes(filmPlane, lensPlane);
    const seg = schLine && clipLineToBox(schLine, bigBox.min, bigBox.max);
    if (seg) drawLineSeg(dyn, seg, COL.scheimpflug, 0.008);
    hingeLine = posf && intersectPlanes(posf, focalPlane);
    const seg2 = hingeLine && clipLineToBox(hingeLine, bigBox.min, bigBox.max);
    if (seg2) drawLineSeg(dyn, seg2, COL.hinge, 0.008);
  }

  // --- readout ----------------------------------------------------------------
  const lensFilmAngle = THREE.MathUtils.radToDeg(Math.acos(Math.min(1, Math.abs(nl.dot(nr)))));
  const posfAngle = posf ? THREE.MathUtils.radToDeg(Math.acos(Math.min(1, Math.abs(posf.n.dot(nr))))) : NaN;
  const hinge = hingeLine || (posf && intersectPlanes(posf, focalPlane));
  const J = hinge ? Cl.clone().sub(hinge.p).cross(hinge.dir).length() : Infinity;
  const mag = Number.isFinite(dObj) && dObj > 0 ? s / dObj : 0;

  const viewCam = P.camera === 'view camera';   // angles and the Scheimpflug/hinge lines only matter with movements
  let txt = `<b>Lens</b> f = ${P.focal} mm · on-axis film distance ${fmt(s / MM, 1)} mm` +
    (viewCam ? ` · lens/film angle ${fmt(lensFilmAngle, 1)}°` : '') + `\n`;
  if (!posf) txt += `${sw(COL.posf)}Plane of sharp focus: <b>at infinity</b>\n`;
  else if (virtual) txt += `<span class="warn">${sw(COL.posfVirtual)}Image distance ≤ f: focused "beyond infinity" (only the real part in front of the lens is drawn)</span>\n`;
  else txt += `${sw(COL.posf)}<b>Plane of sharp focus</b>: on-axis distance ${fmt(dObj)} m (m = 1:${fmt(1 / mag, 0)})` +
              (viewCam ? `, ${fmt(posfAngle, 1)}° from film plane` : '') + `\n`;
  if (sharpQuad) {
    const L = (i, j) => sharpQuad[i].distanceTo(sharpQuad[j]);
    const w = [L(0, 1), L(3, 2)], hh = [L(0, 3), L(1, 2)];
    const rng = v => Math.abs(v[0] - v[1]) < 0.005 * Math.max(v[0], v[1]) ? fmt(v[0]) : `${fmt(Math.min(...v))}–${fmt(Math.max(...v))}`;
    txt += `${sw(COL.fov)}<b>Sharp area in frame</b> (${P.format}, on the plane): ${rng(w)} m wide × ${rng(hh)} m high\n`;
  } else if (sharpPoly.length >= 3) {
    txt += `${sw(COL.fov)}<b>Sharp area in frame</b>: the plane leaves the frame through infinity (area cut at the scene extent)\n`;
  } else if (posf) {
    txt += `${sw(COL.fov)}Frame does not meet the plane of sharp focus in front of the lens\n`;
  }
  txt += `${sw(nVig ? COL.vignette : 0x9a9a9a)}Coverage: image circle ${P.imageCircle} mm (half-angle ${fmt(THREE.MathUtils.radToDeg(covAngle), 1)}°): ` +
    (nVig ? `<span class="warn">${nVig} frame corner${nVig > 1 ? 's' : ''} outside → vignetting</span>` : 'all frame corners inside') + `\n`;
  const H = f * f / (P.fnumber * coc * MM) + f;    // hyperfocal distance of the untilted lens
  txt += `${sw(COL.dof)}<b>Depth of field</b> f/${P.fnumber}, CoC ${fmt(coc, 3)} mm` +
    (P.cocMode === 'manual' ? '' :
      ` (${fmt(printBlur, 2)} mm on a ${P.printLong} cm print viewed from ${P.viewDist} cm, ${fmt(enlargement, 1)}× enlargement)`) + `\n`;
  txt += axisIv
    ? `   on the lens axis ${fmt(axisIv.tNear)} m – ${Number.isFinite(axisIv.tFar) ? fmt(axisIv.tFar) + ' m' : '∞'}   (hyperfocal H = ${fmt(H, 1)} m)\n`
    : `   nothing acceptably sharp along the lens axis\n`;
  if (dofInfo.missing) txt += `   ${dofInfo.missing} frame corner${dofInfo.missing > 1 ? 's' : ''} look past the DoF wedge: nothing sharp there at any distance\n`;
  if (dofInfo.farInfinite) txt += `   far limit at ∞ for part of the frame; volume cut at the scene extent\n`;
  txt += `${sw(COL.axis)}lens axis / focus point   ${sw(COL.film)}film plane   ${sw(COL.lens)}lens plane`;
  if (viewCam) {
    txt += `\n${sw(COL.scheimpflug)}Scheimpflug line (film ∩ lens): ${schLine || lensFilmAngle > 1e-6 ? 'present' : 'at infinity (planes parallel)'}\n`;
    txt += `${sw(COL.hinge)}Hinge line: distance from lens J = ${Number.isFinite(J) ? fmt(J) + ' m' : '∞'}` +
           (lensFilmAngle > 1e-6 ? `  (f / sin α = ${fmt(f / Math.sin(THREE.MathUtils.degToRad(lensFilmAngle)))} m)` : '');
  }
  document.getElementById('infoBody').innerHTML = txt;
}
// legend collapses to its title bar and back, like the control panel
document.getElementById('infoTitle').addEventListener('click', () => infoEl.classList.toggle('closed'));

// ----------------------------------------------------------------------------
// GUI
// ----------------------------------------------------------------------------
const gui = new GUI({ title: 'Settings', width: 310 });
const cameraCtrl = gui.add(P, 'camera', ['normal camera', 'view camera']).name('camera');
const fL = gui.addFolder('Lens & focus');
const formatCtrl = fL.add(P, 'format', Object.keys(FORMATS)).name('format');
fL.add(P, 'autoLens').name('set lens when changing format');
const R0 = formatRanges();
const extCtrl = fL.add(P, 'extension', ...R0.extension, 0.1).name('standard separation (mm)').decimals(2);
focusCtrl = new MappedNumberController(fL, P, 'focusDist', 0.2, FOCUS_SLIDER_CAP, 0.01, LOG_MAP).name('focus distance (m)').decimals(2);
const focalCtrl = fL.add(P, 'focal', ...R0.focal, 1).name('focal length (mm)');
fL.add(P, 'refocusOnFocal').name('keep focus when changing lens');
const icCtrl = fL.add(P, 'imageCircle', ...R0.imageCircle, 1).name('image circle at ∞ (mm)');
const shiftCtrls = [];   // rise/fall and shift sliders of both standards, filled in below
// re-range the format-dependent sliders and clamp their values into the new range
function applyFormatRanges() {
  const R = formatRanges();
  const set = (ctrl, key, [lo, hi]) => { ctrl.min(lo).max(hi); P[key] = THREE.MathUtils.clamp(P[key], lo, hi); };
  set(extCtrl, 'extension', R.extension);
  set(focalCtrl, 'focal', R.focal);
  set(icCtrl, 'imageCircle', R.imageCircle);
  for (const c of shiftCtrls) set(c, c.property, [-R.shift, R.shift]);
}
fL.add({ hyperfocal: () => {
  const f = P.focal * MM, coc = circleOfConfusion(FORMATS[P.format][0]).coc * MM;
  setSeparationForFocus(f * f / (P.fnumber * coc) + f);      // H = f² / (N c) + f, from the lens
  gui.controllersRecursive().forEach(c => c.updateDisplay());
  update();
} }, 'hyperfocal').name('Focus at hyperfocal distance');
// lil-gui runs the panel-wide onChange (the rebuild) before a controller's own handler, so rebuild again here
formatCtrl.onChange(v => {
  if (P.autoLens) {
    P.focal = Math.round(Math.hypot(...FORMATS[v]));          // "normal" lens = format diagonal
    P.imageCircle = IMAGE_CIRCLE[v];
    P.extension = separationFor(P.focal, DEFAULT_FOCUS);      // not snapped to the slider step: focus is very sensitive here
  }
  applyFormatRanges();
  gui.controllersRecursive().forEach(c => c.updateDisplay());
  update();
});

const fF = gui.addFolder('Front standard (lens)');
new MappedNumberController(fF, P, 'frontTilt', -30, 30, 0.25, ANGLE_MAP).name('tilt ° (+ top forward)');
new MappedNumberController(fF, P, 'frontSwing', -30, 30, 0.25, ANGLE_MAP).name('swing ° (+ to left)');
shiftCtrls.push(fF.add(P, 'frontRise', -R0.shift, R0.shift, 1).name('rise / fall (mm)'),
                fF.add(P, 'frontShift', -R0.shift, R0.shift, 1).name('shift (mm)'));

const fR = gui.addFolder('Rear standard (film)');
new MappedNumberController(fR, P, 'rearTilt', -30, 30, 0.25, ANGLE_MAP).name('tilt ° (+ top forward)');
new MappedNumberController(fR, P, 'rearSwing', -30, 30, 0.25, ANGLE_MAP).name('swing ° (+ to left)');
shiftCtrls.push(fR.add(P, 'rearRise', -R0.shift, R0.shift, 1).name('rise / fall (mm)'),
                fR.add(P, 'rearShift', -R0.shift, R0.shift, 1).name('shift (mm)'));
const pivotCtrl = gui.add(P, 'tiltPivot', ['axis', 'base']).name('tilt pivot');
const ZERO = { frontTilt: 0, frontSwing: 0, frontRise: 0, frontShift: 0, rearTilt: 0, rearSwing: 0, rearRise: 0, rearShift: 0 };
const resetCtrl = gui.add({ reset: () => { Object.assign(P, ZERO); gui.controllersRecursive().forEach(c => c.updateDisplay()); update(); } }, 'reset')
  .name('Reset movements');
// normal camera: no movements at all; the standards' folders, the pivot and the reset button are hidden
function applyCameraMode() {
  const view = P.camera === 'view camera';
  // image circle and the Scheimpflug/hinge lines only matter with movements
  for (const x of [fF, fR, pivotCtrl, resetCtrl, icCtrl, linesCtrl]) view ? x.show() : x.hide();
  if (!view) Object.assign(P, ZERO);
}
cameraCtrl.onChange(() => { applyCameraMode(); gui.controllersRecursive().forEach(c => c.updateDisplay()); update(); });
// (applied once all controllers exist, after the Display folder below)

const fD = gui.addFolder('Depth of field');
fD.add(P, 'fnumber', [1, 1.4, 2, 2.8, 4, 5.6, 8, 11, 16, 22, 32, 45, 64, 90]).name('f-number');
fD.add(P, 'cocMode', ['from print', 'manual']).name('circle of confusion');
cocCtrls.print.push(
  fD.add(P, 'printLong', 10, 200, 1).name('print long edge (cm)'),
  fD.add(P, 'viewDist', 20, 300, 5).name('viewing distance (cm)'),
  fD.add(P, 'eyeRes', 1000, 3000, 50).name('eye resolves 1/x rad'));
cocCtrls.manual.push(fD.add(P, 'coc', 0.02, 0.5, 0.005).name('CoC on film (mm)'));

const fV = gui.addFolder('Display');
fV.add(P, 'showSharpArea').name('sharp area in frame');
fV.add(P, 'showFullPlane').name('extended plane of sharp focus');
fV.add(P, 'showDof').name('in-focus volume in frame');
fV.add(P, 'showDofPlanes').name('extended near/far limit planes');
fV.add(P, 'showFov').name('field of view rays');
fV.add(P, 'showCoverage').name('lens coverage on film');
fV.add(P, 'showCoverageCone').name('lens coverage cone');
fV.add(P, 'showPlanes').name('extended film & lens planes');
const linesCtrl = fV.add(P, 'showLines').name('Scheimpflug & hinge lines');
fV.add(P, 'showBellows').name('bellows');
fV.add(P, 'showGround').name('ground');
fV.add(P, 'showUnderground').name('parts below the ground');
fV.close();
applyCameraMode();

const fS = gui.addFolder('Scene');
fS.add(P, 'cameraHeight', 0.1, 2.5, 0.05).name('lens height (m)');
fS.add(P, 'extent', 1, 40, 0.5).name('scene extent (m)');
fS.close();

// Mouse wheel on sliders: lil-gui scales the change by the raw wheel delta, which on many systems is
// several steps per notch and piles up when scrolling fast. Replace it: one notch = one step
// (ten with Shift), touchpad pixel deltas are accumulated into notches, and a controller may define
// its own wheelFn(value, notches) (the focus slider scrolls by 2 % per notch).
function installWheel(ctrl) {
  let acc = 0;
  ctrl.$widget.addEventListener('wheel', e => {
    const onSlider = ctrl.$slider && ctrl.$slider.contains(e.target);
    const onInput = ctrl.$input.contains(e.target) && ctrl._inputFocused;
    if (!onSlider && !onInput) return;
    if (onSlider && Math.abs(e.deltaX) < Math.abs(e.deltaY) && ctrl._hasScrollBar) return;   // let a scrollable panel scroll
    e.preventDefault(); e.stopImmediatePropagation();
    acc += e.deltaY / (e.deltaMode === 0 ? 100 : e.deltaMode === 1 ? 3 : 1);   // one notch ≈ 100 px (Chrome) or 3 lines (Firefox)
    const n = Math.trunc(acc);
    if (!n) return;
    acc -= n;
    const notches = -n * (e.shiftKey ? 10 : 1), v = ctrl.getValue();
    ctrl._snapClampSetValue(ctrl.wheelFn ? ctrl.wheelFn(v, notches) : v + notches * ctrl._step);
    ctrl._callOnFinishChange();
  }, { capture: true, passive: false });
}
focusCtrl.wheelFn = (v, n) => v * Math.pow(1.02, n);
gui.controllersRecursive().forEach(c => { if (c instanceof NumberController) installWheel(c); });

// the panel-wide handler sees which controller changed, so the focus slider can drive the separation
gui.onChange(e => {
  if (e.controller === focusCtrl) { setSeparationForFocus(e.value); extCtrl.updateDisplay(); }
  // a new focal length = a different lens: refocus it on the same subject distance, so the
  // separation follows the focal length and the field of view scales inversely with it
  if (e.controller === focalCtrl && P.refocusOnFocal) { setSeparationForFocus(P.focusDist); extCtrl.updateDisplay(); }
  update();
});
if (matchMedia('(max-width: 700px)').matches) gui.close();   // phones: start with the 3D view, tap the title to open

// ----------------------------------------------------------------------------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
update();
renderer.render(scene, camera);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
