<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo tools</title>
<link rel="icon" href="../favicon.ico">
<style>
  :root { color-scheme: dark; --bg: #1c1e22; --panel: #26282e; --panel2: #31343b; --text: #f2f3f5; --muted: #b8bec8;
          --accent: #4fa8ff; --cyan: #3ee6ff; --yellow: #ffd84f; --green: #4fe07a; --border: #555; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header a { color: var(--muted); margin-left: auto; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  nav button.active { background: var(--accent); color: #000; border-color: var(--accent); }
  button.action { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; width: 100%; margin: 6px 0 2px; }
  button.action:hover { border-color: var(--accent); }
  main { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; padding: 16px; align-items: start; }
  /* the settings column stays on screen while the tool scrolls; if it is taller than the window it scrolls by itself */
  aside { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; overflow-x: hidden; }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); padding: 12px; }   /* minmax(0, …): a wide table must not widen the page */ aside { position: static; max-height: none; overflow: visible; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .card h2 .reset { float: right; font: 12px/1 system-ui, sans-serif; text-transform: none; letter-spacing: 0; color: var(--accent); cursor: pointer; }
  .card h2 .reset:hover { text-decoration: underline; }
  .card h3 { font-size: 14px; margin: 14px 0 8px; color: var(--text); }
  .field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; margin: 8px 0; }
  .field .val { display: flex; align-items: center; gap: 5px; }
  .field input[type=number] { width: 78px; background: var(--panel2); color: var(--accent); border: 1px solid var(--border);
                              border-radius: 4px; padding: 4px 6px; font: inherit; text-align: right; }
  .field select, .field input[type=checkbox] { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; font: inherit; }
  .field select { max-width: 200px; min-width: 0; }   /* long film names must not widen the panel */
  .field input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0 0 2px; }
  .inline-fields { display: flex; flex-wrap: wrap; gap: 4px 28px; margin-top: 6px; }   /* compact controls under a chart: label next to its input */
  .inline-fields .field { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
  .unit { color: var(--muted); min-width: 26px; }
  .note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .warn { color: #ffb347; }   /* a caution: low reliability, vignetting, no data */
  .note .off { visibility: hidden; }   /* a warning that does not apply: still laid out, so its space is kept at any width */
  .extrap { color: #ffb347; font-style: italic; }   /* a value extrapolated beyond its data sheet: orange like the other cautions, italic to tell it apart */
  td.hl.warn, td.hl2.warn, td.hlm.warn, td.hlc.warn, td.hl.extrap, td.hl2.extrap, td.hlm.extrap, td.hlc.extrap { color: #ffcf8a; text-shadow: 0 0 2px #000; }   /* a lighter orange on a highlighted row */
  td a, .note a { color: var(--accent); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; table-layout: fixed; }   /* fixed: equal columns, widths do not follow the content */
  table.hf { width: max(100%, 680px); } table.dof { width: max(100%, 1070px); font-size: 13px; } table.fmts { width: max(100%, 880px); font-size: 13px; }
  table.fmts th:first-child { width: 110px; } table.fmts th:last-child { width: 170px; }
  table.rtimes { width: max(100%, 480px); font-size: 13px; } table.rfilms { width: max(100%, 1060px); font-size: 13px; }
  table.rfilms th:first-child { width: 170px; } table.rfilms th:nth-child(2) { width: 100px; } table.rfilms th:nth-child(3) { width: 50px; }
  table.rfilms th:nth-child(4) { width: 190px; } table.rfilms th:nth-child(5) { width: 90px; } table.rfilms th:nth-child(6) { width: 230px; } table.rfilms th:last-child { width: 190px; }
  table.rfilms td:first-child { white-space: normal; }
  table.rfilms th:nth-child(n+4) { text-align: left; }   /* the text columns: headers aligned like their cells */
  table.rfilms th { white-space: normal; vertical-align: bottom; }   /* a long heading such as 'corrected (10.0 s)' wraps rather than being cut */
  th:first-child { width: 128px; }
  th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid #474b53; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th:first-child, td:first-child { text-align: left; color: var(--muted); }
  th { color: var(--muted); font-weight: 500; }
  .hl { background: rgba(70, 110, 160, .22); }   /* row / column highlight: muted like .hl2, lighter */
  .hl2 { background: rgba(60, 110, 170, .45); color: #fff; }   /* current row ∩ current column: a muted, darker blue so coloured warnings stay legible; no bold, it would widen the column */
  .hlm { background: rgba(62, 180, 220, .3); }   /* the chosen film's row in the all-films table: the cyan of its curve */
  .hlc { background: rgba(180, 95, 160, .32); }   /* the comparison film's row: the muted magenta of its curve */
  .cmp { background: rgba(180, 95, 160, .12); }   /* the comparison film's columns */
  td.hl.cmp { background: rgba(180, 95, 160, .32); }   /* … on the highlighted row */
  .main { background: rgba(62, 200, 230, .14); }   /* the chosen film's columns, a faint cyan */
  td.hl.main { background: rgba(62, 180, 220, .3); }
  table.rtimes th.group { white-space: normal; text-align: center; }   /* a film's name over its two columns */
  table.rtimes th.group.film { color: var(--cyan); } table.rtimes th.group.cmp { color: #d4a8c6; }
  table.rtimes thead tr + tr th:first-child { width: auto; text-align: right; }   /* the second header row starts under the film, not in the metered column */
  table.dtt { width: max(100%, 780px); font-size: 13px; } table.dtt th:first-child { width: 76px; }
  table.dtt th, table.dtt td { padding: 4px 4px; }   /* tighter: room for an inserted column such as '24.5 °C' */
  td.short { opacity: .5; }   /* a development time under 5 min: Ilford advises against it */
  select[data-key=film] { color: var(--cyan); }   /* the two film dropdowns carry their curves' colours */
  select[data-key=film2]:not(.none) { color: #d4a8c6; }
  .tablewrap { overflow-x: auto; }
  .results { display: flex; flex-wrap: wrap; gap: 8px; }   /* tiles size to their content, they do not fill the row */
  .results.two { display: grid; grid-template-columns: max-content repeat(2, max-content); align-items: center; margin-top: 12px; }
  .results .rowlabel { color: var(--muted); font-size: 13px; text-align: right; padding-right: 6px; }
  .results .rowlabel b { color: var(--text); font-weight: 600; display: block; }
  @media (max-width: 560px) { .results.two { grid-template-columns: 1fr; } .results .rowlabel { text-align: left; margin-top: 6px; } }
  /* phones: the text keeps its padding, the charts run across the card's padding and border and most of the page's
     12 px padding, stopping 6 px short of the screen edges so the axis labels are not flush with them */
  @media (max-width: 560px) { #dofBar, #dofCurves, #spScene, #spChart, #rcChart, #dtChart { margin: 0 -21px; } }
  .stat { background: var(--panel2); border-radius: 6px; padding: 8px 12px; min-width: 120px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat .v.pair { font-size: 16px; }
  svg { width: 100%; height: auto; display: block; touch-action: none; user-select: none; cursor: ew-resize; }
  svg text { fill: var(--text); font-size: 13px; }   /* was var(--muted) */   /* the viewBox is sized in pixels, so this is the real size on screen */
  svg .axis { stroke: #9096a0; }
  svg .grid { stroke: #474b53; }
  svg .grid.minor { stroke: #35383f; }   /* the half steps between labelled times */
  svg .std { stroke: #4a7fb5; stroke-width: 1.5px; opacity: .5; }   /* the standard 20 °C / 68 °F: blue, kept quiet so the curves stand out */
  svg .ptlabel { font-size: 12px; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }   /* the point labels: a dark halo keeps them legible over the grid */
  svg .short { fill: #c2651a; opacity: .14; }   /* the band of development times under 5 min, which Ilford advises against */
  svg .outside { fill: #8f7bd8; opacity: .12; }   /* temperatures outside the 18–27 °C of Ilford’s chart, where its rule is extrapolated */
  @media print { header nav, header a, aside { display: none; } body { background: #fff; color: #000; } .card { border-color: #999; background: #fff; } }
</style>
</head>
<body>
<header>
  <h1>Photo tools</h1>
  <nav id="nav"></nav>
  <a href="../3d/">3D camera model</a> <a href="../" style="margin-left: 12px">all tools</a>
</header>
<main>
  <aside id="shared"></aside>
  <section id="tool"></section>
</main>
<script src="optics.js"></script>
<script>
'use strict';
const O = Optics;

// ---------------------------------------------------------------------------
// Shared state: camera settings used by every tool. Persisted per browser.
// ---------------------------------------------------------------------------
const S = {
  format: '35 mm', autoLens: true, focal: 50, fnumber: 11,
  cocMode: 'print', printLong: 40, viewDist: 50, eyeRes: 1500, coc: 0.1,
  focus: 3,           // m, used by the DoF tools
  chartMin: 0.3, chartMax: 100,   // m, distance axes of the DoF charts
  spreadMode: 'spread', spreadDelta: 4, railNear: 54, railFar: 50, spreadFocus: 5, spreadPos: 50,   // focus spread tool (mm; spreadFocus: the standard's focus, m; spreadPos: % of the way from the near to the far focus)
  targetFormat: 'APS-C', eqRef: 'diagonal', sceneDist: 3,   // formats tool: the format compared with, the dimension compared, subject distance (m)
  film: 'Ilford HP5+', film2: 'none', meteredTime: 10, rcAperture: 'none', customP: 1.3, customThreshold: 1, rcLog: true, rcMax: 60,   // reciprocity tool (times in s; rcMax = span of the chart's metered axis)
  devTime: 8, devTempFrom: 20, devTempTo: 24, devUnit: 'C', devModel: 'ilford', devPercent: 10, devAgitation: 'intermittent', devChart: 'nomograph', devLog: false,   // development time tool (time in min, temperatures in devUnit)
  tool: 'dof',
};
const DEFAULTS = { ...S };   // before the stored settings are applied, for the reset links
try { Object.assign(S, JSON.parse(localStorage.getItem('phototools') || '{}')); } catch (e) { /* storage unavailable: keep defaults */ }
function save() { try { localStorage.setItem('phototools', JSON.stringify(S)); } catch (e) { /* ignore */ } }

// a list of full stops with the current f-number inserted in order when it is a half stop between them
const withCurrent = aps => aps.includes(S.fnumber) || S.fnumber < aps[0] || S.fnumber > aps[aps.length - 1] ? aps : [...aps, S.fnumber].sort((a, b) => a - b);
// Lines that come and go as an input is dragged would make the page below jump. They are always laid out instead:
// keptLine(text, shown) hides an inapplicable line but keeps its height (however it wraps), and alternatives([[node,
// active], …]) stacks texts in one spot so the box is as tall as the longest of them, showing only the active one.
const keptLine = (content, shown, cls = '') => h('span', { class: (cls + (shown ? '' : ' off')).trim(), style: 'display: block' }, content);
const alternatives = items => h('span', { style: 'display: grid' },
  items.map(([content, active, cls = '']) => h('span', { class: (cls + (active ? '' : ' off')).trim(), style: 'grid-area: 1 / 1' }, content)));
function cocInfo() {
  return S.cocMode === 'manual' ? { coc: S.coc, enlargement: NaN, printBlur: NaN }
                                : O.cocFromPrint(S.format, S.printLong, S.viewDist, S.eyeRes);
}
const fmt = (x, d = 2) => Number.isFinite(x) ? x.toFixed(d) : (x === Infinity ? '∞' : '–');
const fmtM = m => !Number.isFinite(m) ? (m === Infinity ? '∞' : '–') : m >= 100 ? m.toFixed(0) : m >= 10 ? m.toFixed(1) : m.toFixed(2);   // metres, no unit (tables)
const fmtDist = m => !Number.isFinite(m) ? (m === Infinity ? '∞' : '–') : m >= 100 ? m.toFixed(0) + '\u00a0m' : m >= 10 ? m.toFixed(1) + '\u00a0m' : m >= 0.995 ? m.toFixed(2) + '\u00a0m' : (m * 100).toFixed(0) + '\u00a0cm';   // 0.995 would round to 100 cm, show it as 1.00 m

// ---------------------------------------------------------------------------
// Tiny DOM helpers
// ---------------------------------------------------------------------------
function h(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const svgEl = (tag, attrs = {}, ...children) => {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const c of children.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};

// number input + slider bound to S[key]; log sliders for distances and focal lengths
const fields = {};   // key -> { set(v) } so tools (e.g. a dragged plot) can push values into the inputs
function numField({ label, key, min, max, step, unit = '', log = false, decimals = 0, onChange = update }) {
  const toSlider = v => log ? 1000 * (Math.log(v) - Math.log(min)) / (Math.log(max) - Math.log(min)) : 1000 * (v - min) / (max - min);
  const fromSlider = t => {
    const v = log ? Math.exp(Math.log(min) + t / 1000 * (Math.log(max) - Math.log(min))) : min + t / 1000 * (max - min);
    return +(Math.round(v / step) * step).toFixed(decimals);
  };
  const num = h('input', { type: 'number', value: S[key], min, max, step, 'data-key': key });
  const range = h('input', { type: 'range', min: 0, max: 1000, value: toSlider(S[key]), 'data-key': key + ':range' });
  num.addEventListener('input', () => { const v = parseFloat(num.value); if (Number.isFinite(v)) { S[key] = Math.min(max, Math.max(min, v)); range.value = toSlider(S[key]); onChange(); } });
  range.addEventListener('input', () => { S[key] = fromSlider(+range.value); num.value = S[key]; onChange(); });
  fields[key] = { set(v) { S[key] = v; num.value = +v.toFixed(decimals); range.value = toSlider(v); } };
  return h('div', { class: 'field' }, h('label', {}, label), h('div', { class: 'val' }, num, h('span', { class: 'unit' }, unit)), range);
}
// two number inputs "from … to …" bound to S[keyMin], S[keyMax]; keeps min < max
function rangeField({ label, keyMin, keyMax, min, max, unit = '', onChange = update }) {
  const a = h('input', { type: 'number', value: S[keyMin], min, max, step: 'any' });
  const b = h('input', { type: 'number', value: S[keyMax], min, max, step: 'any' });
  const commit = () => {
    let lo = parseFloat(a.value), hi = parseFloat(b.value);
    if (!Number.isFinite(lo) || !Number.isFinite(hi)) return;
    lo = Math.min(max, Math.max(min, lo)); hi = Math.min(max, Math.max(min, hi));
    if (hi < lo * 1.5) { if (document.activeElement === a) hi = Math.min(max, lo * 1.5); else lo = Math.max(min, hi / 1.5); }
    S[keyMin] = lo; S[keyMax] = hi; a.value = lo; b.value = hi; onChange();
  };
  a.addEventListener('change', commit); b.addEventListener('change', commit);
  return h('div', { class: 'field' }, h('label', {}, label),
    h('div', { class: 'val' }, a, h('span', { class: 'unit' }, '–'), b, h('span', { class: 'unit' }, unit)));
}
function selectField({ label, key, options, labels = String, onChange = update }) {
  const sel = h('select', { 'data-key': key, onchange: () => { S[key] = isNaN(+sel.value) ? sel.value : +sel.value; onChange(); } },
    options.map(o => h('option', { value: o, selected: String(o) === String(S[key]) }, labels(o))));
  return h('div', { class: 'field' }, h('label', {}, label), sel);
}
function checkField({ label, key, onChange = update }) {
  const cb = h('input', { type: 'checkbox', checked: !!S[key], 'data-key': key, onchange: () => { S[key] = cb.checked; onChange(); } });
  return h('div', { class: 'field' }, h('label', {}, label), cb);
}

// ---------------------------------------------------------------------------
// Shared camera panel
// ---------------------------------------------------------------------------
function renderShared() {
  const root = document.getElementById('shared');
  // rebuilding the panel replaces its controls: remember which one had focus and give it back below,
  // so keyboard use of a select (arrow keys) keeps working across the rebuild it triggers
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  root.replaceChildren();
  const cam = h('div', { class: 'card', style: tools[S.tool] && tools[S.tool].noCamera ? 'display: none' : '' },   // a tool may hide it (reciprocity) or name it ('Source camera')
    h('h2', {}, (tools[S.tool] && tools[S.tool].cameraTitle) || 'Camera'));
  cam.append(selectField({ label: 'format', key: 'format', options: Object.keys(O.FORMATS), onChange: () => {
    if (S.autoLens) { S.focal = Math.round(O.diagonal(S.format)); fields.focal.set(S.focal); }
    update();
  } }));
  cam.append(checkField({ label: 'set lens when changing format', key: 'autoLens' }));
  cam.append(numField({ label: 'focal length', key: 'focal', min: 4, max: 800, step: 1, unit: 'mm', log: true }));
  cam.append(selectField({ label: 'f-number', key: 'fnumber', options: O.APERTURES_HALF }));   // full stops and the half stops between
  root.append(cam);

  const coc = h('div', { class: 'card', id: 'cocCard', style: tools[S.tool] && tools[S.tool].noCoc ? 'display: none' : '' },   // hidden for tools that do not use it
    h('h2', {}, 'Circle of confusion', h('span', { class: 'reset', title: 'back to the defaults: from a 40 cm print viewed from 50 cm, eye 1/1500 rad', onclick: () => {
      for (const k of ['cocMode', 'printLong', 'viewDist', 'eyeRes', 'coc']) S[k] = DEFAULTS[k];
      renderShared(); update();
    } }, 'reset')));
  coc.append(selectField({ label: 'circle of confusion', key: 'cocMode', options: ['print', 'manual'], onChange: () => { renderShared(); update(); } }));
  if (S.cocMode === 'print') {
    coc.append(numField({ label: 'print long edge', key: 'printLong', min: 10, max: 200, step: 1, unit: 'cm' }));
    coc.append(numField({ label: 'viewing distance', key: 'viewDist', min: 20, max: 300, step: 5, unit: 'cm' }));
    coc.append(numField({ label: 'eye resolves 1/x rad', key: 'eyeRes', min: 1000, max: 3500, step: 50, unit: '' }));
  } else {
    coc.append(numField({ label: 'CoC on film', key: 'coc', min: 0.005, max: 0.5, step: 0.005, unit: 'mm', decimals: 3 }));
  }
  coc.append(h('p', { class: 'note', id: 'cocNote' }));
  root.append(coc);
  if (tools[S.tool] && tools[S.tool].renderPanel) tools[S.tool].renderPanel(root);   // the tool's own inputs, below the shared ones
  if (focused) { const el = root.querySelector(`[data-key="${focused}"]`); if (el) el.focus({ preventScroll: true }); }
}

// ---------------------------------------------------------------------------
// SVG plot helpers
// ---------------------------------------------------------------------------
// log-axis ticks within [lo, hi]: 1-2-5 per decade, finer (1-1.5-2-3-5-7) when the range is narrow
function logTicks(lo, hi, maxN = 16) {
  const gen = steps => { const out = []; for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++)
    for (const m of steps) { const v = +(m * 10 ** e).toPrecision(3); if (v >= lo * 0.999 && v <= hi * 1.001) out.push(v); } return out; };
  const fine = gen([1, 1.5, 2, 3, 5, 7]);
  if (fine.length > maxN) { const coarse = gen([1, 2, 5]); return coarse.length > maxN ? gen([1]) : coarse; }
  return fine.length < 5 ? gen([1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5, 6, 7, 8, 9]) : fine;
}
// charts are drawn in CSS pixels: the viewBox matches the container width, so text keeps its size on a phone
// The containers are watched: when their width changes (window resize, or the scrollbar that appears once
// the charts make the page tall), the tool is redrawn, so the first click never changes the chart size.
const chartObserver = typeof ResizeObserver === 'function' ? new ResizeObserver(entries => {
  if (entries.some(e => e.target._drawnW && e.target._drawnW !== chartWidth(e.target))) tools[S.tool].update();
}) : null;
function chartWidth(container) {
  const w = Math.max(300, container.clientWidth || 720);
  if (chartObserver && !container._observed) { container._observed = true; chartObserver.observe(container); }
  container._drawnW = w;
  return w;
}
const tickLabel = v => v >= 1 ? String(v) : v >= 0.1 ? v.toFixed(v * 10 % 1 ? 2 : 1) : v.toFixed(2);
function svgPoint(svg, evt) {   // client -> SVG user coordinates
  const p = svg.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
// Drag anywhere over a chart: onDrag(x, y, phase) in the SVG's user coordinates, fired on press
// (phase 'down') and on every move while the button is held ('move'). The listeners sit on the container, which survives the
// redraws (each update replaces the <svg>); only the callback is refreshed per draw.
function makeDraggable(container, onDrag, onDragEnd = null) {
  container._onDrag = onDrag; container._onDragEnd = onDragEnd;
  if (container._dragBound) return;
  container._dragBound = true;
  let active = false;
  const fire = (e, phase) => { const svg = container.querySelector('svg'); if (svg) { const p = svgPoint(svg, e); container._onDrag(p.x, p.y, phase); } };
  container.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    // preventDefault below keeps the focus where it was: release a focused input, or a phone reopens its keyboard
    const f = document.activeElement; if (f && f !== document.body && f.blur) f.blur();
    active = true; fire(e, 'down'); e.preventDefault();
    try { container.setPointerCapture(e.pointerId); } catch (err) { /* keeps working without capture */ }
  });
  container.addEventListener('pointermove', e => { if (active) fire(e, 'move'); });
  const end = () => { if (active && container._onDragEnd) container._onDragEnd(); active = false; };
  container.addEventListener('pointerup', end);
  container.addEventListener('pointercancel', end);
}

function drawDofBar(container, r) {
  // log distance axis from 0.2 m to 1000 m, then an axis break and ∞ at the right end
  const W = chartWidth(container), Hh = 138, x0 = 34, xInf = W - 24, x1 = xInf - 34, dmin = S.chartMin, dmax = S.chartMax, yAxis = 78;   // rows below the axis: ticks, H label, axis title
  const X = d => d === Infinity ? xInf : x0 + (x1 - x0) * (Math.log(Math.min(dmax, Math.max(dmin, d))) - Math.log(dmin)) / (Math.log(dmax) - Math.log(dmin));
  const Dinv = x => Math.exp(Math.log(dmin) + (Math.min(x1, Math.max(x0, x)) - x0) / (x1 - x0) * (Math.log(dmax) - Math.log(dmin)));
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${Hh}` });
  svg.append(svgEl('line', { x1: x0, x2: x1 + 8, y1: yAxis, y2: yAxis, class: 'axis' }));
  svg.append(svgEl('line', { x1: x1 + 20, x2: xInf, y1: yAxis, y2: yAxis, class: 'axis' }));
  svg.append(svgEl('path', { d: `M${x1 + 9},${yAxis + 5} L${x1 + 14},${yAxis - 5} M${x1 + 15},${yAxis + 5} L${x1 + 20},${yAxis - 5}`, class: 'axis', fill: 'none' }));
  for (const d of logTicks(dmin, dmax, Math.floor((x1 - x0) / 36)).concat([Infinity])) {
    const x = X(d);
    svg.append(svgEl('line', { x1: x, x2: x, y1: yAxis - 4, y2: yAxis + 4, class: 'axis' }));
    svg.append(svgEl('text', { x, y: yAxis + 16, 'text-anchor': 'middle' }, d === Infinity ? '∞' : tickLabel(d)));
  }
  svg.append(svgEl('text', { x: x0, y: Hh - 6 }, 'distance from the lens (m)'));
  const near = r.near / 1000, far = r.far / 1000, s = S.focus, H = r.H / 1000;
  if (Number.isFinite(near)) {
    const xa = X(near), xb = X(far);
    svg.append(svgEl('rect', { x: xa, y: yAxis - 30, width: Math.max(1, xb - xa), height: 24, fill: '#3ee6ff', 'fill-opacity': .35, stroke: '#3ee6ff' }));
    svg.append(svgEl('text', { x: xa, y: yAxis - 36, 'text-anchor': 'end', fill: '#3ee6ff' }, fmtDist(near) + ' '));
    svg.append(svgEl('text', { x: xb, y: yAxis - 36, 'text-anchor': 'start', fill: '#3ee6ff' }, ' ' + fmtDist(far)));
  }
  if (H >= dmin && H <= dmax) {   // hyperfocal mark, only when it is inside the axis range
    const xh = X(H);
    svg.append(svgEl('path', { d: `M${xh - 5},${yAxis + 4} L${xh + 5},${yAxis + 4} L${xh},${yAxis - 3} Z`, fill: '#ffd84f' }));
    svg.append(svgEl('text', { x: xh, y: yAxis + 30, 'text-anchor': 'middle', fill: '#ffd84f' }, 'H ' + fmtDist(H)));
  }
  const xs = X(s);
  svg.append(svgEl('line', { x1: xs, x2: xs, y1: yAxis - 52, y2: yAxis + 4, stroke: '#4fe07a', 'stroke-width': 2 }));
  svg.append(svgEl('circle', { cx: xs, cy: yAxis - 52, r: 5, fill: '#4fe07a', style: 'cursor: ew-resize' }));
  svg.append(svgEl('text', { x: xs, y: yAxis - 62, 'text-anchor': 'middle', fill: '#4fe07a' }, 'focus ' + fmtDist(s)));
  container.replaceChildren(svg);
  makeDraggable(container, x => setFocus(Dinv(x)));
}

function drawDofCurves(container, f, c) {
  const W = chartWidth(container), Hh = Math.round(Math.min(640, Math.max(300, W * 0.7))), x0 = 48, x1 = W - 12, y0 = 16, y1 = Hh - 40;
  const sMin = S.chartMin, sMax = S.chartMax, dMin = S.chartMin, dMax = Math.min(10000, S.chartMax * 10);   // m
  const X = s => x0 + (x1 - x0) * (Math.log(s) - Math.log(sMin)) / (Math.log(sMax) - Math.log(sMin));
  const Y = d => y1 - (y1 - y0) * (Math.log(d) - Math.log(dMin)) / (Math.log(dMax) - Math.log(dMin));
  const Sinv = x => Math.exp(Math.log(sMin) + (x - x0) / (x1 - x0) * (Math.log(sMax) - Math.log(sMin)));
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${Hh}` });
  for (const d of logTicks(dMin, dMax, Math.floor((y1 - y0) / 20))) {
    svg.append(svgEl('line', { x1: x0, x2: x1, y1: Y(d), y2: Y(d), class: 'grid' }));
    svg.append(svgEl('text', { x: x0 - 4, y: Y(d) + 4, 'text-anchor': 'end' }, tickLabel(d)));
  }
  for (const s of logTicks(sMin, sMax, Math.floor((x1 - x0) / 36))) {
    svg.append(svgEl('line', { x1: X(s), x2: X(s), y1: y0, y2: y1, class: 'grid' }));
    svg.append(svgEl('text', { x: X(s), y: y1 + 14, 'text-anchor': 'middle' }, tickLabel(s)));
  }
  svg.append(svgEl('text', { x: x1, y: Hh - 4, 'text-anchor': 'end' }, 'focus distance (m)'));
  svg.append(svgEl('text', { x: x0 + 4, y: y0 + 10 }, 'near / far limit (m)'));
  svg.append(svgEl('line', { x1: x0, x2: x1, y1: y0, y2: y0, class: 'axis' }));
  // the 1:1 line (subject distance itself)
  svg.append(svgEl('line', { x1: X(sMin), y1: Y(sMin), x2: X(sMax), y2: Y(sMax), stroke: '#4fe07a', 'stroke-opacity': .7, 'stroke-dasharray': '3 3' }));
  const apertures = withCurrent(O.APERTURES.filter(N => N >= 2.8 && N <= 64));   // full stops, plus the current one if it lies between
  for (const N of apertures) {
    const cur = N === S.fnumber;
    // sample densely in log s, and add the exact focus distance where the far limit reaches the
    // top edge (far = dMax), so the steep part near the hyperfocal distance is not cut into chords
    const n = 600, samples = [];
    for (let i = 0; i <= n; i++) samples.push(Math.exp(Math.log(sMin) + i / n * (Math.log(sMax) - Math.log(sMin))));
    const { H } = O.dof(f, N, c, sMax * 1000), sTop = (dMax * 1000) * H / (H - f + dMax * 1000) / 1000;
    if (sTop > sMin && sTop < sMax) samples.push(sTop);
    samples.sort((a, b) => a - b);
    let dn = '', df = '';
    samples.forEach((s, i) => {
      const r = O.dof(f, N, c, s * 1000);
      dn += (i ? 'L' : 'M') + X(s).toFixed(2) + ',' + Y(Math.max(dMin, r.near / 1000)).toFixed(2);
      const far = r.far === Infinity ? dMax : Math.min(dMax, r.far / 1000);
      df += (i ? 'L' : 'M') + X(s).toFixed(2) + ',' + Y(far).toFixed(2);
    });
    const style = { fill: 'none', stroke: cur ? '#3ee6ff' : '#7d8390', 'stroke-width': cur ? 2.2 : 1, 'stroke-linejoin': 'round' };
    svg.append(svgEl('path', { d: dn, ...style }), svgEl('path', { d: df, ...style }));
    // labels only where they stay legible: the current aperture and the two extremes, on the near curve
    if (cur || N === apertures[0] || N === apertures[apertures.length - 1]) {
      const rEnd = O.dof(f, N, c, sMax * 1000);
      if (rEnd.near / 1000 >= dMin)   // a curve that runs below the axis range gets no label (they would pile up on the bottom edge)
      svg.append(svgEl('text', { x: x1 - 2, y: Y(Math.max(dMin, rEnd.near / 1000)) + (N === apertures[0] ? -3 : 11), 'text-anchor': 'end', fill: cur ? '#3ee6ff' : '#b8bec8' }, 'f/' + N));
    }
  }
  const s = Math.min(sMax, Math.max(sMin, S.focus)), r = O.dof(f, S.fnumber, c, S.focus * 1000);
  svg.append(svgEl('line', { x1: X(s), x2: X(s), y1: y0, y2: y1, stroke: '#4fe07a', 'stroke-width': 1.5 }));
  for (const d of [r.near / 1000, r.far === Infinity ? dMax : r.far / 1000]) if (d >= dMin)
    svg.append(svgEl('circle', { cx: X(s), cy: Y(Math.min(dMax, d)), r: 3, fill: '#4fe07a' }));
  container.replaceChildren(svg);
  makeDraggable(container, x => setFocus(Sinv(Math.min(x1, Math.max(x0, x)))));
}

function setFocus(m) {
  const v = Math.min(1000, Math.max(0.2, +m.toFixed(2)));
  if (fields.focus) fields.focus.set(v); else S.focus = v;
  update();
}

const stopAtLeast = N => O.APERTURES_HALF.find(a => a >= N * 0.999);            // the widest marked stop not wider than N
const stopAtMost = N => [...O.APERTURES_HALF].reverse().find(a => a <= N * 1.001);   // the smallest marked stop not smaller than N
const stopNearest = N => O.APERTURES_HALF.reduce((a, b) => Math.abs(Math.log(b / N)) < Math.abs(Math.log(a / N)) ? b : a);
// legend lines in the chart colours: [[color, text], text, …] per line
const colorLegend = rows => rows.flatMap((r, i) => [i ? h('br') : '', ...r.map(p => Array.isArray(p) ? h('span', { style: `color: ${p[0]}` }, p[1]) : p)]);
tools.spread = {

      numField({ label: 'rail reading, focused on the nearest point', key: 'railNear', min: 0, max: 100, step: 0.5, unit: 'mm', decimals: 1 }),

    card.append(numField({ label: 'standard focused at (picture below)', key: 'spreadFocus', min: 0.3, max: 1000, step: 0.01, unit: 'm', log: true, decimals: 2 }));
    card.append(h('p', { class: 'note' }, 'Focus on the nearest and on the farthest point that must be sharp, and note where the standard sits each time: the spread is the travel between the two. It holds for any lens, format or tilt; only the circle of confusion from the side panel enters.'));
    root.append(card);
    root.append(h('div', { class: 'card' }, h('h2', {}, 'Result'), h('div', { class: 'results', id: 'spStats' }),

  },
  update() {

function drawFormats(container, src, dst, ref) {
  const W = chartWidth(container), names = Object.keys(O.FORMATS);

  const cx = W / 2, cy = Hh / 2;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${Hh}` });
  const rect = (w, hh, attrs) => svg.append(svgEl('rect', { x: cx - w * k / 2, y: cy - hh * k / 2, width: w * k, height: hh * k, ...attrs }));

  // corner, pushed down while they would overlap a label placed before
  const placed = [];

                  'stroke-width': isDst || isSrc ? 2 : 1 });

  container.replaceChildren(svg);
}

function drawReciprocity(container, film, film2, tm) {

// The classic nomograph: log time across, temperature up, straight parallel lines of constant development.
// Their slope was measured from a printed chart: the time doubles every 7.12 °C (a factor 1.1023 per °C).
const NOMO_PER_C = 1.1023;
function drawNomograph(container) {
  const u = DEV_UNITS[S.devUnit], W = chartWidth(container), Hh = Math.round(Math.min(460, Math.max(300, W * 0.62)));
  const x0 = 14, x1 = W - 28, y0 = 26, y1 = Hh - 40, tMin = 1, tMax = 64, TMin = u.min, TMax = u.max;   // right: two-digit temperatures; top: the unit
  const X = t => x0 + (x1 - x0) * Math.log(t / tMin) / Math.log(tMax / tMin), Y = T => y1 - (y1 - y0) * (T - TMin) / (TMax - TMin);
  const Tinv = y => TMin + (y1 - Math.min(y1, Math.max(y0, y))) / (y1 - y0) * (TMax - TMin);
  const tInv = x => Math.exp(Math.log(tMin) + (Math.min(x1, Math.max(x0, x)) - x0) / (x1 - x0) * Math.log(tMax / tMin));
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${Hh}` });
  svg.append(svgEl('rect', { x: x0, y: y0, width: X(5) - x0, height: y1 - y0, class: 'short' }));   // under 5 min: uneven development
  if (S.devModel === 'ilford') {   // outside the chart's 18–27 °C the rule is extrapolated
    const lo = Y(Math.max(TMin, u.fromC(O.DEV_TEMP.range[0]))), hi = Y(Math.min(TMax, u.fromC(O.DEV_TEMP.range[1])));
    if (lo < y1) svg.append(svgEl('rect', { x: x0, y: lo, width: x1 - x0, height: y1 - lo, class: 'outside' }));
    if (hi > y0) svg.append(svgEl('rect', { x: x0, y: y0, width: x1 - x0, height: hi - y0, class: 'outside' }));
  }
  // grid: time ticks as on the printed chart, thinned until the labels have room; temperature every degree
  const tickSets = [[1, 1.5, 2, 3, 4, 5, 6, 8, 10, 12, 14, 17, 20, 24, 28, 32, 40, 48, 64], [1, 2, 3, 4, 6, 8, 12, 16, 24, 32, 48, 64], [1, 2, 4, 8, 16, 32, 64]];
  const minGap = ts => Math.min(...ts.slice(1).map((t, i) => X(t) - X(ts[i])));
  const labels = tickSets.find(ts => minGap(ts) >= 24) || tickSets[2];
  for (const t of tickSets[0]) svg.append(svgEl('line', { x1: X(t), x2: X(t), y1: y0, y2: y1, class: 'grid' }));
  for (const t of labels) svg.append(svgEl('text', { x: X(t), y: y1 + 14, 'text-anchor': 'middle' }, String(t)));
  const tick = u.step < 1 ? 1 : 2, labelEvery = (y1 - y0) / ((TMax - TMin) / tick) >= 16 ? tick : 2 * tick;
  for (let T = Math.ceil(TMin / tick) * tick; T <= TMax; T += tick) {
    svg.append(svgEl('line', { x1: x0, x2: x1, y1: Y(T), y2: Y(T), class: 'grid' }));
    if (T % labelEvery === 0) svg.append(svgEl('text', { x: x1 + 6, y: Y(T) + 4 }, String(T)));
  }
  svg.append(svgEl('text', { x: x1, y: Hh - 4, 'text-anchor': 'end' }, 'development time (min)'));
  svg.append(svgEl('text', { x: x1 + 6, y: y0 - 10 }, u.sym));   // the temperature unit, above its axis
  const y20 = Y(u.fromC(20));   // the standard temperature, lightly marked
  svg.append(svgEl('line', { x1: x0, x2: x1, y1: y20, y2: y20, class: 'std' }));
  // the family of constant-development lines: through t0 at 20 °C, one every quarter doubling
  const lnF = Math.log(NOMO_PER_C), tAt = (t0, T) => t0 * Math.exp(-lnF * (u.toC(T) - 20)), TAt = (t0, t) => u.fromC(20 - Math.log(t / t0) / lnF);
  for (let k = -24; k <= 40; k++) {
    const t0 = Math.pow(2, k / 4);
    let Ta = TMax, Tb = TMin;                                   // clip to the box: the line enters at tMin or TMax, leaves at tMax or TMin
    if (tAt(t0, Ta) < tMin) Ta = TAt(t0, tMin); if (tAt(t0, Tb) > tMax) Tb = TAt(t0, tMax);
    if (Ta <= Tb) continue;
    svg.append(svgEl('line', { x1: X(tAt(t0, Ta)), y1: Y(Ta), x2: X(tAt(t0, Tb)), y2: Y(Tb), stroke: '#5f6572', 'stroke-width': 1 }));
  }
  const base = { ...devOpts(), continuous: false }, cont = S.devAgitation === 'continuous';
  const curve = (opts, color, width) => {   // the chosen rule through the known point, dashed where extrapolated
    const n = 120; let run = null;
    const flush = () => { if (run) svg.append(svgEl('path', { d: run.d, fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linejoin': 'round', 'stroke-dasharray': run.ext ? '6 4' : null })); run = null; };
    for (let i = 0; i <= n; i++) {
      const T = TMin + (TMax - TMin) * i / n, r = devAt(S.devTime, T, opts), ext = r.status === 'extrapolated';
      if (r.time < tMin || r.time > tMax) { flush(); continue; }
      const pt = X(r.time).toFixed(1) + ',' + Y(T).toFixed(1);
      if (!run || run.ext !== ext) { const prev = run && run.last; flush(); run = { ext, d: (prev ? 'M' + prev + 'L' : 'M') + pt, last: pt }; }
      else { run.d += 'L' + pt; run.last = pt; }
    }
    flush();
  };
  if (cont) curve(devOpts(), '#d4a8c6', 1.6);
  curve(base, '#3ee6ff', 2.2);
  const known = { x: X(Math.min(tMax, Math.max(tMin, S.devTime))), y: Y(S.devTempFrom) };
  svg.append(svgEl('circle', { cx: known.x, cy: known.y, r: 5, fill: '#3ee6ff' }));
  pointLabel(svg, known.x, known.y, `known: ${fmtMin(S.devTime)} at ${S.devTempFrom} ${u.sym}`, '#3ee6ff', [x0, x1, y0]);
  const r = devAt(S.devTime, S.devTempTo), ys = Y(Math.min(TMax, Math.max(TMin, S.devTempTo)));
  svg.append(svgEl('line', { x1: X(Math.min(tMax, Math.max(tMin, r.time))), x2: x1, y1: ys, y2: ys, stroke: '#4fe07a', 'stroke-width': 1.5 }));   // in from the temperature axis to the point
  if (r.time >= tMin && r.time <= tMax) {
    const xs = X(r.time);
    svg.append(svgEl('line', { x1: xs, x2: xs, y1: ys, y2: y1, stroke: '#4fe07a', 'stroke-width': 1, 'stroke-dasharray': '3 3' }));   // read the time off the bottom
    svg.append(svgEl('circle', { cx: xs, cy: ys, r: 5, fill: '#4fe07a' }));
    pointLabel(svg, xs, ys, `new: ${fmtMin(r.time)} at ${S.devTempTo} ${u.sym}`, '#4fe07a', [x0, x1, y0]);
    svg.append(svgEl('text', { x: Math.min(x1 - 20, Math.max(x0 + 20, xs)), y: y1 + 28, 'text-anchor': 'middle', fill: '#4fe07a' }, fmtMin(r.time)));
  }
  container.replaceChildren(svg);
  // two handles: on press the nearer one is picked, if it is within reach, and kept for the whole drag; a press
  // elsewhere does nothing. The known point moves freely (snapping to the inputs' steps); the new-temperature
  // point slides up and down the curve.
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by), xNew = X(Math.min(tMax, Math.max(tMin, r.time)));   // at the edge when off the axis
  makeDraggable(container, (x, y, phase) => {
    if (phase === 'down') {
      const dK = dist(x, y, known.x, known.y), dN = dist(x, y, xNew, ys);
      container._handle = Math.min(dK, dN) > DRAG_REACH ? null : dK < dN ? 'known' : 'new';
    }
    if (!container._handle) return;
    const T = u.round(Tinv(y));
    if (container._handle === 'known') {
      const t = Math.min(60, Math.max(1, Math.round(tInv(x) * 4) / 4));   // the time input's 0.25 min steps
      if (fields.devTime) fields.devTime.set(t); else S.devTime = t;
      if (fields.devTempFrom) fields.devTempFrom.set(T); else S.devTempFrom = T;
    } else if (fields.devTempTo) fields.devTempTo.set(T); else S.devTempTo = T;
    update();
  });
}

// ---------------------------------------------------------------------------
// App shell
// ---------------------------------------------------------------------------
function renderNav() {
  const nav = document.getElementById('nav');
  nav.replaceChildren(...Object.entries(tools).map(([id, t]) =>
    h('button', { class: id === S.tool ? 'active' : '', onclick: () => selectTool(id) }, t.title)));
}
// Each tab is addressable as #id (e.g. …/calculators/#reciprocity), so a link can open a given tab.
function selectTool(id) {
  if (!tools[id] || id === S.tool) return;
  S.tool = id;
  history.replaceState(null, '', '#' + id);   // keep the address in step without filling the history
  renderNav(); renderTool();
}
function toolFromHash() { return decodeURIComponent(location.hash.slice(1)).toLowerCase(); }
window.addEventListener('hashchange', () => selectTool(toolFromHash()));   // a hash link followed on the page itself
function renderTool() {
  const root = document.getElementById('tool');
  root.replaceChildren();
  renderShared();   // the side panel depends on the tool (its own inputs, whether the CoC card is shown)
  tools[S.tool].render(root);
  update();
}
function update() {
  const ci = cocInfo();
  const note = document.getElementById('cocNote');
  if (note) note.textContent = S.cocMode === 'manual' ? `CoC ${fmt(ci.coc, 3)} mm on film`
    : `CoC ${fmt(ci.coc, 3)} mm on film (${fmt(ci.printBlur, 2)} mm on the print, ${fmt(ci.enlargement, 1)}× enlargement)`;
  tools[S.tool].update();
  save();
}
if (!chartObserver) window.addEventListener('resize', () => tools[S.tool].update());   // fallback: charts are drawn in pixels
if (tools[toolFromHash()]) S.tool = toolFromHash();   // a link to a tab wins over the remembered one
if (!tools[S.tool]) S.tool = 'dof';
renderShared();
renderNav();
renderTool();
</script>
</body>
