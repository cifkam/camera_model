const WHEEL_NOTCH = 0.02;

    const onSlider = c.$slider.contains(e.target), onInput = e.target === c.$input && c._inputFocused;
    if (!onSlider && !onInput) return;
    if (onSlider && Math.abs(e.deltaX) < Math.abs(e.deltaY) && c._hasScrollBar) return;   // let the panel scroll
    e.preventDefault(); e.stopPropagation();
    if (c.getValue() !== last) frac = map.toFrac(c.getValue(), c._min, c._max);
    const px = (e.deltaX - e.deltaY) * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
    frac = Math.max(0, Math.min(1, frac + px / 100 * WHEEL_NOTCH));

// Derived camera: a thin lens whose centre L is the centre of projection, and the sensor behind it. Focusing moves
// the sensor, so the pixel scale follows its distance, not f: refocusing closer narrows the view.
// A view camera moves both standards on the body (the frame P.yaw/pitch/roll and P.camX/Y/Z set, its origin where
// the lens sits without movements). The front one moves the lens: rise and shift slide it across, tilt and swing
// turn it; the chief ray through L goes straight on whichever way it is turned, so that changes only where things
// come to focus (Scheimpflug) and the shape of the blur. The rear one moves the sensor: rise and shift slide it in
// its plane, tilt and swing turn it, which changes the picture itself (the image plane is another one). Focusing
// slides the sensor along the body's rail.
// The camera frame of the projection is the sensor's own (x right, y down, z square to it, out towards the lens),
// centred on L: the picture is then the pinhole projection K [R | t] from L, the principal point being where the

  for (const key of Object.keys(SHAPES)) {
    if (!P.show[key]) continue;

    if (key === 'axes') s.geom.edges.forEach(([a, b], n) => dyn.add(rod(v[a], v[b], s.edgeColors[n])));
    else dyn.add(segments(s.geom.edges.map(([a, b]) => [v[a], v[b]]), lineMat(s.color)));

}

const fmt = (x, p = 4) => {
  if (!isFinite(x)) return '∞';
  if (Math.abs(x) < 5e-12) return '0';
  const s = String(+x.toPrecision(p));
  return s.includes('e') ? x.toExponential(p - 1) : s.replace('-', '−');
};
const fx1 = (x, n = 1) => isFinite(x) ? x.toFixed(n).replace('-', '−') : '∞';
const vec = (v, n = 3) => '(' + v.map(x => fx1(x, n)).join(', ') + ')';
const metres = mm => !isFinite(mm) ? '∞' : mm >= 1000 ? `${fmt(mm / 1000, 3)} m` : `${fmt(mm / 10, 3)} cm`;
function matrix(rows, f = fmt) {
  const cols = rows[0].length;
  return `<span class="mat" style="grid-template-columns: repeat(${cols}, auto)">` + rows.map(r => r.map(x => `<span>${f(x)}</span>`).join('')).join('') + '</span>';
}
const openState = {};
function section(id, title, html) {
  return `<details data-id="${id}"${openState[id] === false ? '' : ' open'}><summary>${title}</summary>${html}</details>`;
}
// how deep the objects' sharp images reach behind the lens: from the nearest object's to the farthest one's
function imageSpan() {
  const zs = [], ds = [];
  for (const key of Object.keys(SHAPES)) {
    if (!P.show[key] || key === 'grid') continue;
    for (const X of placed(key)) {
      const i = sharpImage(Cam.add(Cam.mulv(cam.R, X), cam.t));
      if (i && i.z >= 3 * lens.f) { zs.push(i.z); ds.push(-i.P[2]); }
    }
  }
  if (!zs.length) return '';
  const near = Math.min(...zs), far = Math.max(...zs), dNear = Math.max(...ds), dFar = Math.min(...ds);
  return `<div class="note num">The objects, ${metres(near)} to ${metres(far)} away, come to focus between
    ${fmt(dFar, 5)} and ${fmt(dNear, 5)} mm behind the lens: their images are ${fmt(dNear - dFar, 3)} mm deep
    (${fmt((far - near) / (dNear - dFar), 3)} × shallower than the scene).</div>`;
}
const fovAt = v => [2 * Math.atan(P.sensorW / 2 / v), 2 * Math.atan(sensorH() / 2 / v)].map(a => a * 180 / Math.PI);

      <tr><td>the sensor, slid along the rail through that axial image, lies D behind the lens (square to the sensor)</td><td>${fmt(D, 5)} mm</td></tr>

fEx.add(P, 'yaw', -180, 180, 0.5).name('yaw (°)').onChange(update);
fEx.add(P, 'pitch', -90, 90, 0.5).name('pitch (°)').onChange(update);
fEx.add(P, 'roll', -180, 180, 0.5).name('roll (°)').onChange(update);
fEx.add({ aim: () => {
  const a = Cam.lookAt([P.camX, P.camY, P.camZ], SCENE_CENTRE);
  P.yaw = round1(a.yaw); P.pitch = round1(a.pitch); update();
} }, 'aim').name('look at the objects');

const fScene = gui.addFolder('Scene');
for (const key of Object.keys(SHAPES)) fScene.add(P.show, key).name(SHAPES[key].label).onChange(update);
const movable = Object.keys(SHAPES).filter(k => SHAPES[k].movable);
fScene.add(P, 'edit', Object.fromEntries(movable.map(k => [SHAPES[k].label, k]))).name('move').onChange(refresh);
const objProxy = {};
for (const k of ['x', 'y', 'z', 'yaw'])
  Object.defineProperty(objProxy, k, { get: () => P.objects[P.edit][k], set: v => { P.objects[P.edit][k] = v; } });
fScene.add(objProxy, 'x', -8, 8, 0.05).name('object X (m)').onChange(update);
fScene.add(objProxy, 'y', -8, 12, 0.05).name('object Y (m)').onChange(update);
fScene.add(objProxy, 'z', -1, 4, 0.05).name('object Z (m)').onChange(update);
fScene.add(objProxy, 'yaw', -180, 180, 1).name('object turn (°)').onChange(update);

const fView = gui.addFolder('View');
addMapped(fView, P, 'camScale', 1, 200, 1, LOG_MAP).name('camera enlarged ×').onChange(update);
fView.add(P, 'frustumDepth', 1, 30, 0.5).name('field of view to (m)').onChange(update);
fView.add(P, 'showDof').name('near and far DoF planes, in front of the lens').onChange(update);
fView.add(P, 'showDofImage').name('near and far DoF planes, behind the lens').onChange(update);
fView.add(P, 'showCone').name('light cone of the selected vertex').onChange(update);
fView.add(P, 'allCones').name('cones from every vertex of the object').onChange(update);
fView.add(P, 'imageSpace').name('objects behind the lens, where they are sharp').onChange(update);
fView.add(P, 'showShift').name('reach of rise / fall and shift (view camera)').onChange(update);
// the one setting for the picture rather than the 3D view, set apart by a line
fView.add(P, 'blurOutlines').name('picture: outline the blur shapes of the vertices').onChange(update).domElement.classList.add('apart');

gui.add({ reset: () => {
  const keep = clone(DEFAULTS);
  for (const k of Object.keys(keep)) P[k] = keep[k];   // P.show copies into the object the checkboxes hold
  presetSel.preset = '';
  showMode(); applyShiftLimit(); update(); viewOverview();
} }, 'reset').name('reset everything');
// P.show must stay the object the checkboxes are bound to
{
  const showObj = P.show;
  Object.defineProperty(P, 'show', { get: () => showObj, set: v => Object.assign(showObj, v), enumerable: true });
}
gui.controllersRecursive().filter(c => c._hasSlider).forEach(tameWheel);
fEx.close(); fScene.close(); fView.close();
showMode();
if (matchMedia('(max-width: 760px)').matches) gui.close();

// ----------------------------------------------------------------------------
function update() {
  buildCamera();
  projectScene();
  drawImageView();
  drawTexture();
  rebuild3D();
  updateMath();
  updateCaption();
  refresh();
  saveState();
  requestRender();
}
function layout() { resize3D(); drawImageView(); }
new ResizeObserver(layout).observe(worldEl);
new ResizeObserver(() => drawImageView()).observe(document.getElementById('imageWrap'));
update();
resize3D();
</script>
</body>
</html>
